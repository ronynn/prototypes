<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Solar System</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene background="color: #000011">
    <!-- Lighting -->
    <a-entity light="type: ambient; color: #444; intensity: 0.5"></a-entity>
    <a-entity light="type: point; intensity: 2; distance: 0; decay: 0" position="0 0 0"></a-entity>

    <!-- Camera -->
    <a-entity camera position="0 5 20" look-controls></a-entity>

    <!-- Sun -->
    <a-sphere position="0 0 0" radius="1.5" color="#FFD166" emissive="#FFAA00" emissive-intensity="0.8"></a-sphere>

    <!-- Orbit paths (rings) -->
    <a-ring radius-inner="2.5" radius-outer="2.6" position="0 0 0" rotation="-90 0 0" color="#555" opacity="0.5"></a-ring>
    <a-ring radius-inner="4.0" radius-outer="4.1" position="0 0 0" rotation="-90 0 0" color="#555" opacity="0.5"></a-ring>
    <a-ring radius-inner="6.0" radius-outer="6.1" position="0 0 0" rotation="-90 0 0" color="#555" opacity="0.5"></a-ring>
    <a-ring radius-inner="8.0" radius-outer="8.1" position="0 0 0" rotation="-90 0 0" color="#555" opacity="0.5"></a-ring>
    <a-ring radius-inner="10.0" radius-outer="10.1" position="0 0 0" rotation="-90 0 0" color="#555" opacity="0.5"></a-ring>

    <!-- Mercury -->
    <a-entity orbit="speed: 0.8">
      <a-sphere position="2.5 0 0" radius="0.2" color="#B5B5B5"></a-sphere>
    </a-entity>

    <!-- Venus -->
    <a-entity orbit="speed: 0.6">
      <a-sphere position="4 0 0" radius="0.35" color="#E6C87A"></a-sphere>
    </a-entity>

    <!-- Earth -->
    <a-entity orbit="speed: 0.5">
      <a-sphere position="6 0 0" radius="0.4" color="#3A9BDC"></a-sphere>
      <!-- Moon -->
      <a-entity orbit="speed: 1.5" position="6 0 0">
        <a-sphere position="0.8 0 0" radius="0.1" color="#CCCCCC"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- Mars -->
    <a-entity orbit="speed: 0.4">
      <a-sphere position="8 0 0" radius="0.3" color="#C1440E"></a-sphere>
    </a-entity>

    <!-- Jupiter -->
    <a-entity orbit="speed: 0.25">
      <a-sphere position="10 0 0" radius="0.9" color="#D2A679"></a-sphere>
      <!-- Great Red Spot (simple) -->
      <a-sphere position="10 0.4 0.7" radius="0.15" color="#B45A3C"></a-sphere>
    </a-entity>

    <!-- Saturn -->
    <a-entity orbit="speed: 0.2">
      <a-sphere position="12 0 0" radius="0.75" color="#E8D5A3"></a-sphere>
      <!-- Rings -->
      <a-ring position="12 0 0" rotation="-90 0 0" radius-inner="0.9" radius-outer="1.4" color="#CDB38C" opacity="0.8"></a-ring>
    </a-entity>

    <!-- Simple starfield (using many small spheres) -->
    <a-entity id="stars"></a-entity>
  </a-scene>

  <script src="lib/aframe.js"></script>
  <script>
    // Custom component for orbiting
    AFRAME.registerComponent('orbit', {
      schema: {
        speed: { type: 'number', default: 0.5 }
      },
      tick: function (time, timeDelta) {
        // timeDelta is in milliseconds, convert to seconds
        const deltaSec = timeDelta / 1000;
        this.el.object3D.rotation.y += this.data.speed * deltaSec;
      }
    });

    // Generate random stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('a-sphere');
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      const radius = 30 + Math.random() * 20;
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);
      star.setAttribute('position', `${x} ${y} ${z}`);
      star.setAttribute('radius', '0.08');
      star.setAttribute('color', '#FFFFFF');
      starsContainer.appendChild(star);
    }

    // Add a slight tilt to the whole solar system for a nicer view
    document.querySelector('a-scene').object3D.rotation.x = 0.3;
  </script>
</body>
</html>
