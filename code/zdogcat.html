<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zdog Cat — Centered</title>
<script src="lib/zdog.dist.min.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background-color: #FDB;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas.zdog-canvas {
    display: block;
    cursor: move;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas class="zdog-canvas"></canvas>
<script>
  const black = '#333';
  const white = '#FFF';
  const pink  = '#F9B';

  const illo = new Zdog.Illustration({
    element: '.zdog-canvas',
    dragRotate: true,
    rotate: { y: -Zdog.TAU / 8 },
  });

  /* ---- Head ---- */
  const head = new Zdog.Shape({
    addTo: illo,
    translate: { y: -20 },
    stroke: 40,
    color: black,
  });

  /* ---- Ears ---- */
  const ear = new Zdog.Cone({
    addTo: head,
    diameter: 12,
    length: 12,
    translate: { x: -15, y: -22, z: 2 },
    rotate: { x: Zdog.TAU / 4, z: Zdog.TAU / 16 },
    color: black,
    stroke: 4,
  });
  ear.copy({
    translate: { x: 15, y: -22, z: 2 },
    rotate: { x: Zdog.TAU / 4, z: -Zdog.TAU / 16 },
  });

  /* ---- Face ---- */
  const eye = new Zdog.Ellipse({
    addTo: head,
    diameter: 4,
    translate: { x: -10, y: -2, z: 18 },
    stroke: 2,
    color: white,
    fill: true,
  });
  eye.copy({ translate: { x: 10, y: -2, z: 18 } });

  new Zdog.Rect({
    addTo: head,
    width: 6,
    height: 4,
    translate: { y: 6, z: 18 },
    cornerRadius: 2,
    color: pink,
    fill: true,
    stroke: 2,
  });

  const whisker = new Zdog.Shape({
    addTo: head,
    path: [{ x: 15, y: 8 }, { x: 35, y: 12 }],
    translate: { z: 16 },
    stroke: 1,
    color: white,
  });
  whisker.copy({ path: [{ x: 15, y: 12 }, { x: 35, y: 14 }] });
  whisker.copy({ translate: { x: -15, z: 16 }, path: [{ x: 0, y: 8 }, { x: -20, y: 12 }] });
  whisker.copy({ translate: { x: -15, z: 16 }, path: [{ x: 0, y: 12 }, { x: -20, y: 14 }] });

  /* ---- Body ---- */
  const body = new Zdog.Cylinder({
    addTo: illo,
    diameter: 30,
    length: 45,
    translate: { y: 25 },
    rotate: { x: Zdog.TAU / 4 },
    color: black,
    stroke: 6,
  });

  /* ---- Tail ---- */
  new Zdog.Shape({
    addTo: body,
    path: [{ y: 0, z: 0 }, { y: 0, z: 30 }, { y: -10, z: 40 }],
    translate: { y: -15, z: -5 },
    closed: false,
    stroke: 8,
    color: black,
  });

  /* ---- Responsive square canvas, perfectly centered ---- */
  function fit() {
    const size = Math.min(window.innerWidth, window.innerHeight) * 0.92;
    if (illo.setSize) {
      illo.setSize(size, size);
    } else {
      const c = illo.element;
      illo.width = size;
      illo.height = size;
      c.width = size;
      c.height = size;
      c.style.width = size + 'px';
      c.style.height = size + 'px';
    }
    illo.zoom = size / 140;   // cat spans roughly 90 units
  }
  fit();
  window.addEventListener('resize', fit);

  (function animate() {
    illo.updateRenderGraph();
    requestAnimationFrame(animate);
  })();
</script>
</body>
</html>
