<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BE NOT AFRAID</title>
  <style>
    body { margin: 0; background: #020003; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; height: 100vh; overflow: hidden; }
    .container { position: relative; height: min(100vh, 133.33vw); aspect-ratio: 3 / 4; max-width: 100vw; display: flex; justify-content: center; align-items: center; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="gl"></canvas>
    <canvas id="ui" width="600" height="800"></canvas>
  </div>

  <script type="module">
    import { Renderer, Camera, Transform, Mesh, Sphere, Box, Program } from '/lib/ogl/index.js'

    // Section - Core System Setup
    let glCanvas = document.getElementById('gl')
    let uiCanvas = document.getElementById('ui')
    let ctx = uiCanvas.getContext('2d')

    let renderer = new Renderer({ canvas: glCanvas, width: 600, height: 800, dpr: Math.min(window.devicePixelRatio || 1, 2), alpha: true })
    let gl = renderer.gl
    gl.clearColor(0.01, 0.0, 0.02, 1.0)

    let camera = new Camera(gl, { fov: 48, near: 0.1, far: 100 })
    camera.perspective({ aspect: 600 / 800 })
    camera.position.set(0, 0, 10)

    let scene = new Transform()

    function resize()
    {
      renderer.setSize(600, 800)
      camera.perspective({ aspect: 600 / 800 })
    }
    resize()

    let gameState = 'start'
    let score = 0
    let highScore = 0

    let birdY = 0
    let birdVY = 0
    let gravity = -18
    let jumpForce = 6.2
    let ringRot = 0

    let maxPillars = 3
    let pillarPool = []
    let spawnTimer = 0
    let spawnInterval = 1.7
    let gameSpeed = 3.2

    let maxBlood = 5
    let bloodPool = []
    let bloodSpawnTimer = 0

    let audioCtx
    let droneOsc
    let droneOsc2
    let droneFilter
    let noiseBuffer

    // Section - WebGL Shaders
    let vertShader = `
      attribute vec3 position;
      attribute vec3 normal;

      uniform mat4 modelViewMatrix;
      uniform mat4 projectionMatrix;
      uniform mat3 normalMatrix;

      varying vec3 vNormal;
      varying vec3 vPosition;

      void main()
      {
        vNormal = normalize(normalMatrix * normal);
        vec4 vertPos = modelViewMatrix * vec4(position, 1.0);
        vPosition = vertPos.xyz;
        gl_Position = projectionMatrix * vertPos;
      }
    `

    let fragShader = `
      precision mediump float;

      varying vec3 vNormal;
      varying vec3 vPosition;

      uniform vec3 uColor;
      uniform float uTime;
      uniform float uIsPipe;

      void main()
      {
        vec3 lightDir = normalize(vec3(1.0, 1.5, 2.0));
        vec3 normal = normalize(vNormal);
        float diff = max(dot(normal, lightDir), 0.2);

        vec3 viewDir = normalize(-vPosition);
        vec3 reflectDir = reflect(-lightDir, normal);

        if (uIsPipe > 0.5)
        {
          float stripe = sin(vPosition.y * 8.0 + sin(vPosition.x * 12.0)) * 0.5 + 0.5;
          float drip = sin(vPosition.y * 14.0 - uTime * 3.5 + vPosition.x * 6.0) * 0.5 + 0.5;
          float vein = sin(vPosition.x * 18.0 + vPosition.y * 18.0) * 0.5 + 0.5;

          vec3 baseFlesh = mix(vec3(0.12, 0.01, 0.02), vec3(0.45, 0.02, 0.04), stripe);
          vec3 bloodRed = mix(baseFlesh, vec3(0.85, 0.0, 0.04), drip * 0.7 + vein * 0.3);

          float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0) * 2.0;
          vec3 finalCol = bloodRed * diff + vec3(1.0, 0.7, 0.7) * spec;
          gl_FragColor = vec4(finalCol, 1.0);
        }
        else
        {
          float spec = pow(max(dot(viewDir, reflectDir), 0.0), 16.0) * 0.5;
          vec3 finalCol = uColor * diff + vec3(1.0, 0.8, 0.8) * spec;
          gl_FragColor = vec4(finalCol, 1.0);
        }
      }
    `

    function createProgram(color, isPipe = 0)
    {
      return new Program(gl, {
        vertex: vertShader,
        fragment: fragShader,
        uniforms: {
          uColor: { value: color },
          uTime: { value: 0 },
          uIsPipe: { value: isPipe }
        },
        cullFace: gl.BACK
      })
    }

    // Section - Audio Engine
    function createNoiseBuffer()
    {
      let bufferSize = audioCtx.sampleRate * 0.5
      let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate)
      let output = buffer.getChannelData(0)
      for (let i = 0; i < bufferSize; i++)
      {
        output[i] = Math.random() * 2 - 1
      }
      return buffer
    }

    function initAudio()
    {
      if (audioCtx)
      {
        return
      }

      let AudioContextClass = window.AudioContext || window.webkitAudioContext
      audioCtx = new AudioContextClass()
      noiseBuffer = createNoiseBuffer()

      droneOsc = audioCtx.createOscillator()
      droneOsc2 = audioCtx.createOscillator()
      droneFilter = audioCtx.createBiquadFilter()
      let droneGain = audioCtx.createGain()

      droneOsc.type = 'sawtooth'
      droneOsc.frequency.setValueAtTime(26, audioCtx.currentTime)

      droneOsc2.type = 'square'
      droneOsc2.frequency.setValueAtTime(28.5, audioCtx.currentTime)

      droneFilter.type = 'lowpass'
      droneFilter.frequency.setValueAtTime(85, audioCtx.currentTime)

      droneGain.gain.setValueAtTime(0.3, audioCtx.currentTime)

      droneOsc.connect(droneFilter)
      droneOsc2.connect(droneFilter)
      droneFilter.connect(droneGain)
      droneGain.connect(audioCtx.destination)

      droneOsc.start()
      droneOsc2.start()
    }

    function playFlapSound()
    {
      if (!audioCtx)
      {
        return
      }

      let subOsc = audioCtx.createOscillator()
      let subGain = audioCtx.createGain()
      subOsc.type = 'sine'
      subOsc.frequency.setValueAtTime(110, audioCtx.currentTime)
      subOsc.frequency.exponentialRampToValueAtTime(18, audioCtx.currentTime + 0.25)

      subGain.gain.setValueAtTime(1.0, audioCtx.currentTime)
      subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25)

      subOsc.connect(subGain)
      subGain.connect(audioCtx.destination)
      subOsc.start()
      subOsc.stop(audioCtx.currentTime + 0.25)

      let noise = audioCtx.createBufferSource()
      noise.buffer = noiseBuffer
      let noiseFilter = audioCtx.createBiquadFilter()
      noiseFilter.type = 'lowpass'
      noiseFilter.frequency.setValueAtTime(300, audioCtx.currentTime)

      let noiseGain = audioCtx.createGain()
      noiseGain.gain.setValueAtTime(0.5, audioCtx.currentTime)
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18)

      noise.connect(noiseFilter)
      noiseFilter.connect(noiseGain)
      noiseGain.connect(audioCtx.destination)

      noise.start()
      noise.stop(audioCtx.currentTime + 0.18)
    }

    function playScoreSound()
    {
      if (!audioCtx)
      {
        return
      }

      let o1 = audioCtx.createOscillator()
      let o2 = audioCtx.createOscillator()
      let gain = audioCtx.createGain()

      o1.type = 'sawtooth'
      o2.type = 'sawtooth'

      o1.frequency.setValueAtTime(164.81, audioCtx.currentTime)
      o2.frequency.setValueAtTime(233.08, audioCtx.currentTime)

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime)
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7)

      o1.connect(gain)
      o2.connect(gain)
      gain.connect(audioCtx.destination)

      o1.start()
      o2.start()
      o1.stop(audioCtx.currentTime + 0.7)
      o2.stop(audioCtx.currentTime + 0.7)
    }

    function playDeathSound()
    {
      if (!audioCtx)
      {
        return
      }

      let sub = audioCtx.createOscillator()
      let subGain = audioCtx.createGain()
      sub.type = 'sawtooth'
      sub.frequency.setValueAtTime(160, audioCtx.currentTime)
      sub.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.4)

      subGain.gain.setValueAtTime(1.0, audioCtx.currentTime)
      subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4)

      sub.connect(subGain)
      subGain.connect(audioCtx.destination)
      sub.start()
      sub.stop(audioCtx.currentTime + 1.4)

      let screech = audioCtx.createOscillator()
      let screechGain = audioCtx.createGain()
      screech.type = 'sawtooth'
      screech.frequency.setValueAtTime(1400, audioCtx.currentTime)
      screech.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 1.0)

      screechGain.gain.setValueAtTime(0.8, audioCtx.currentTime)
      screechGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0)

      screech.connect(screechGain)
      screechGain.connect(audioCtx.destination)

      screech.start()
      screech.stop(audioCtx.currentTime + 1.0)
    }

    // Section - 3D Scene Initialization
    let sphereGeo = new Sphere(gl, { radius: 1, widthSegments: 16, heightSegments: 16 })
    let boxGeo = new Box(gl, { width: 1, height: 1, depth: 1 })

    let pipeProgram = createProgram([0.5, 0.0, 0.0], 1)
    let spikeProgram = createProgram([0.8, 0.0, 0.0], 0)
    let bloodProgram = createProgram([0.85, 0.02, 0.05], 0)

    let birdGroup = new Transform()
    birdGroup.setParent(scene)
    birdGroup.position.set(-1.8, 0, 0)

    let sclera = new Mesh(gl, { geometry: sphereGeo, program: createProgram([0.87, 0.87, 0.87]) })
    sclera.scale.set(0.55, 0.55, 0.55)
    sclera.setParent(birdGroup)

    let iris = new Mesh(gl, { geometry: sphereGeo, program: createProgram([0.75, 0.0, 0.0]) })
    iris.scale.set(0.28, 0.28, 0.28)
    iris.position.set(0, 0, 0.45)
    iris.setParent(birdGroup)

    let pupil = new Mesh(gl, { geometry: sphereGeo, program: createProgram([0.0, 0.0, 0.0]) })
    pupil.scale.set(0.13, 0.13, 0.13)
    pupil.position.set(0, 0, 0.65)
    pupil.setParent(birdGroup)

    let ringGroup = new Transform()
    ringGroup.setParent(birdGroup)

    for (let i = 0; i < 8; i++)
    {
      let angle = (i / 8) * Math.PI * 2
      let feather = new Mesh(gl, { geometry: boxGeo, program: createProgram([0.45, 0.05, 0.05]) })
      feather.scale.set(0.11, 0.11, 0.11)
      feather.position.set(Math.cos(angle) * 0.95, Math.sin(angle) * 0.95, 0)
      feather.rotation.z = angle
      feather.setParent(ringGroup)
    }

    let dustGroup = new Transform()
    dustGroup.setParent(scene)
    for (let i = 0; i < 15; i++)
    {
      let dust = new Mesh(gl, { geometry: sphereGeo, program: createProgram([0.5, 0.05, 0.05]) })
      dust.scale.set(0.04, 0.04, 0.04)
      dust.position.set((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 4)
      dust.setParent(dustGroup)
    }

    // Section - Pools Setup
    for (let i = 0; i < maxPillars; i++)
    {
      let topP = new Mesh(gl, { geometry: boxGeo, program: pipeProgram })
      topP.scale.set(1.3, 10, 1.3)
      topP.setParent(scene)

      let botP = new Mesh(gl, { geometry: boxGeo, program: pipeProgram })
      botP.scale.set(1.3, 10, 1.3)
      botP.setParent(scene)

      let topSpike = new Mesh(gl, { geometry: sphereGeo, program: spikeProgram })
      topSpike.scale.set(0.7, 0.7, 0.7)
      topSpike.setParent(scene)

      let botSpike = new Mesh(gl, { geometry: sphereGeo, program: spikeProgram })
      botSpike.scale.set(0.7, 0.7, 0.7)
      botSpike.setParent(scene)

      topP.position.set(999, 0, 0)
      botP.position.set(999, 0, 0)
      topSpike.position.set(999, 0, 0)
      botSpike.position.set(999, 0, 0)

      pillarPool.push({
        topP: topP,
        botP: botP,
        topSpike: topSpike,
        botSpike: botSpike,
        x: 999,
        gapY: 0,
        gapSize: 3.3,
        active: false,
        passed: false
      })
    }

    for (let i = 0; i < maxBlood; i++)
    {
      let bMesh = new Mesh(gl, { geometry: sphereGeo, program: bloodProgram })
      bMesh.scale.set(0.08, 0.08, 0.08)
      bMesh.position.set(999, 0, 0)
      bMesh.setParent(scene)

      bloodPool.push({
        mesh: bMesh,
        x: 999,
        y: 0,
        vy: 0,
        active: false
      })
    }

    function spawnPillarFromPool()
    {
      for (let i = 0; i < maxPillars; i++)
      {
        let p = pillarPool[i]
        if (!p.active)
        {
          p.active = true
          p.passed = false
          p.x = 7.5
          p.gapY = (Math.random() - 0.5) * 4.0
          break
        }
      }
    }

    function spawnBloodDropFromPool()
    {
      for (let i = 0; i < maxBlood; i++)
      {
        let b = bloodPool[i]
        if (!b.active)
        {
          b.active = true
          b.x = -1.8 + (Math.random() - 0.5) * 0.3
          b.y = birdY - 0.3
          b.vy = -1.5 - Math.random() * 2.0
          break
        }
      }
    }

    // Section - Game Loops & Inputs
    function resetGame()
    {
      for (let i = 0; i < maxPillars; i++)
      {
        let p = pillarPool[i]
        p.active = false
        p.topP.position.set(999, 0, 0)
        p.botP.position.set(999, 0, 0)
        p.topSpike.position.set(999, 0, 0)
        p.botSpike.position.set(999, 0, 0)
      }

      for (let i = 0; i < maxBlood; i++)
      {
        let b = bloodPool[i]
        b.active = false
        b.mesh.position.set(999, 0, 0)
      }

      birdY = 0
      birdVY = 0
      score = 0
      spawnTimer = 0
      gameState = 'playing'
    }

    function triggerJump()
    {
      initAudio()
      if (gameState === 'start' || gameState === 'dead')
      {
        resetGame()
      }
      else if (gameState === 'playing')
      {
        birdVY = jumpForce
        playFlapSound()
      }
    }

    window.addEventListener('pointerdown', function()
    {
      triggerJump()
    })

    window.addEventListener('keydown', function(e)
    {
      if (e.code === 'Space')
      {
        triggerJump()
      }
    })

    let lastTime = performance.now()
    let dustRot = 0

    function gameLoop(now)
    {
      let dt = (now - lastTime) / 1000
      if (dt > 0.1)
      {
        dt = 0.1
      }
      lastTime = now

      pipeProgram.uniforms.uTime.value = now * 0.001

      dustRot += dt * 0.2
      dustGroup.rotation.z = dustRot

      if (gameState === 'playing')
      {
        birdVY += gravity * dt
        birdY += birdVY * dt

        ringRot += dt * 3.0
        ringGroup.rotation.z = ringRot

        let tilt = Math.max(-0.6, Math.min(0.6, birdVY * 0.08))
        birdGroup.rotation.z = tilt
        birdGroup.position.y = birdY

        bloodSpawnTimer += dt
        if (bloodSpawnTimer > 0.15)
        {
          bloodSpawnTimer = 0
          spawnBloodDropFromPool()
        }

        for (let i = 0; i < maxBlood; i++)
        {
          let b = bloodPool[i]
          if (b.active)
          {
            b.vy += gravity * 0.2 * dt
            b.y += b.vy * dt
            b.x -= gameSpeed * 0.3 * dt
            b.mesh.position.set(b.x, b.y, 0)

            if (b.y < -6.5)
            {
              b.active = false
              b.mesh.position.set(999, 0, 0)
            }
          }
        }

        if (birdY > 5.2 || birdY < -5.2)
        {
          die()
        }

        spawnTimer += dt
        if (spawnTimer >= spawnInterval)
        {
          spawnTimer = 0
          spawnPillarFromPool()
        }

        for (let i = 0; i < maxPillars; i++)
        {
          let p = pillarPool[i]
          if (p.active)
          {
            p.x -= gameSpeed * dt

            let topY = p.gapY + (p.gapSize / 2) + 5
            let botY = p.gapY - (p.gapSize / 2) - 5

            p.topP.position.set(p.x, topY, 0)
            p.botP.position.set(p.x, botY, 0)
            p.topSpike.position.set(p.x, p.gapY + (p.gapSize / 2) + 0.6, 0)
            p.botSpike.position.set(p.x, p.gapY - (p.gapSize / 2) - 0.6, 0)

            if (!p.passed && p.x < -1.8)
            {
              p.passed = true
              score++
              if (score > highScore)
              {
                highScore = score
              }
              playScoreSound()
            }

            if (p.x < -1.1 && p.x > -2.5)
            {
              let safeTop = p.gapY + (p.gapSize / 2) - 0.45
              let safeBot = p.gapY - (p.gapSize / 2) + 0.45
              if (birdY > safeTop || birdY < safeBot)
              {
                die()
              }
            }

            if (p.x < -7.5)
            {
              p.active = false
              p.topP.position.set(999, 0, 0)
              p.botP.position.set(999, 0, 0)
              p.topSpike.position.set(999, 0, 0)
              p.botSpike.position.set(999, 0, 0)
            }
          }
        }
      }

      renderer.render({ scene, camera })
      drawUI()
      requestAnimationFrame(gameLoop)
    }

    function die()
    {
      if (gameState === 'dead')
      {
        return
      }
      gameState = 'dead'
      playDeathSound()
    }

    // Section - UI Rendering
    function drawUI()
    {
      ctx.clearRect(0, 0, uiCanvas.width, uiCanvas.height)

      ctx.shadowColor = '#ff0000'
      ctx.shadowBlur = 10
      ctx.fillStyle = '#ffffff'
      ctx.font = 'bold 26px monospace'

      ctx.textAlign = 'left'
      ctx.fillText('SCORE: ' + score, 30, 55)

      ctx.textAlign = 'right'
      ctx.fillText('HIGH: ' + highScore, 570, 55)

      ctx.shadowBlur = 0

      if (gameState === 'start')
      {
        ctx.textAlign = 'center'
        ctx.fillStyle = '#ff1133'
        ctx.font = 'bold 42px monospace'
        ctx.shadowColor = '#aa0000'
        ctx.shadowBlur = 15
        ctx.fillText('BE NOT AFRAID', 300, 380)

        ctx.shadowBlur = 0
        ctx.fillStyle = '#ffffff'
        ctx.font = '20px monospace'
        ctx.fillText('TAP TO ASCEND', 300, 440)

        ctx.fillStyle = '#886666'
        ctx.font = '14px monospace'
        ctx.fillText('NAVIGATE THE SACRIFICIAL VOID', 300, 480)
      }
      else if (gameState === 'dead')
      {
        ctx.textAlign = 'center'
        ctx.fillStyle = '#cc0000'
        ctx.font = 'bold 40px monospace'
        ctx.shadowColor = '#ff0000'
        ctx.shadowBlur = 15
        ctx.fillText('PERISHED IN DARKNESS', 300, 380)

        ctx.shadowBlur = 0
        ctx.fillStyle = '#ffffff'
        ctx.font = '22px monospace'
        ctx.fillText('TAP TO RETRY', 300, 440)
      }
    }

    requestAnimationFrame(gameLoop)
  </script>

</body>
</html>
