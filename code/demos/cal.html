<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; font-family: monospace; }
  body { background: #111; color: #fff; margin: 0; padding: 10px; height: 100vh; overflow: hidden; }
  
  .header-container { display: flex; justify-content: center; align-items: center; position: relative; padding: 15px; }
  .month-picker-btn { font-size: 18px; color: #aaa; background: none; border: none; cursor: pointer; }
  #hidden-picker { position: absolute; opacity: 0; width: 120px; height: 30px; cursor: pointer; }

  .week-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: #888; font-size: 12px; margin-bottom: 5px; }
  .week-days div { padding: 5px; }
  .week-days .sun { color: #ff5252; }
  .week-days .sat { color: #00b0ff; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: calc((100vh - 120px) / 6); border-top: 1px solid #222; border-left: 1px solid #222; }
  .cell { border-right: 1px solid #222; border-bottom: 1px solid #222; padding: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; background: #0a0a0a; }
  .cell:hover { background: #151515; }
  .cell.empty { background: #111; visibility: hidden; }
  
  .day-num { font-size: 14px; color: #fff; }
  .cell.sun .day-num { color: #ff5252; }
  .cell.sat .day-num { color: #00b0ff; }
  
  .dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* Modal layout */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10; }
  .modal-content { background: #1e1e1e; margin: 10% auto; padding: 20px; width: 85%; max-width: 500px; border: 1px solid #333; max-height: 70vh; overflow-y: auto; }
  .modal-date { font-size: 18px; color: #00b0ff; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .event-item { margin: 15px 0; padding-left: 10px; border-left: 3px solid #fff; }
  .history-section { margin-top: 20px; border-top: 1px dashed #444; padding-top: 10px; }
  .history-title { color: #ffb300; font-size: 14px; margin-bottom: 5px; }
</style>
</head>
<body>

<div class="header-container">
  <button class="month-picker-btn" id="month-label">June 2026</button>
  <input type="month" id="hidden-picker">
</div>

<div class="week-days">
  <div class="sun">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div class="sat">SAT</div>
</div>

<div class="grid" id="cal-grid"></div>

<div id="gk-modal" class="modal">
  <div class="modal-content" id="modal-inside">
    <h3 class="modal-date" id="m-date"></h3>
    <div id="m-events"></div>
    <div class="history-section" id="m-history-box">
      <div class="history-title">ON THIS DAY IN HISTORY:</div>
      <div id="m-history-events"></div>
    </div>
  </div>
</div>

<script>
let currentYear = 2026;
let currentMonth = 5; // June
let events = [];

const grid = document.getElementById('cal-grid');
const picker = document.getElementById('hidden-picker');
const modal = document.getElementById('gk-modal');

// load csv logic
fetch('events.csv')
  .then(r => r.text())
  .then(txt => {
    parse(txt);
    render();
  });

function parse(txt) {
  const lines = txt.split('\n').slice(1);
  lines.forEach(l => {
    if (!l.trim()) return;
    const [date, color, event, extra] = l.split(',');
    events.push({ date: date.trim(), color: color.trim(), event: event.trim(), extra: extra.trim() });
  });
}

function render() {
  grid.innerHTML = '';
  const names = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  document.getElementById('month-label').innerText = `${names[currentMonth]} ${currentYear}`;
  
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  
  // empty cells
  for (let i = 0; i < firstDay; i++) {
    const emptyCell = document.createElement('div');
    emptyCell.className = 'cell empty';
    grid.appendChild(emptyCell);
  }
  
  // active cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dayOfWeek = new Date(currentYear, currentMonth, d).getDay();
    const mStr = String(currentMonth + 1).padStart(2, '0');
    const dStr = String(d).padStart(2, '0');
    const ISO = `${currentYear}-${mStr}-${dStr}`;
    const MD = `${mStr}-${dStr}`;
    
    // exact day events
    const exactEvents = events.filter(e => e.date === ISO);
    
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (dayOfWeek === 0) cell.classList.add('sun');
    if (dayOfWeek === 6) cell.classList.add('sat');
    
    let dotsHtml = '<div class="dots">';
    exactEvents.forEach(e => {
      dotsHtml += `<div class="dot" style="background:${e.color}"></div>`;
    });
    dotsHtml += '</div>';
    
    cell.innerHTML = `<div class="day-num">${d}</div>${dotsHtml}`;
    
    cell.onclick = () => openDay(ISO, MD);
    grid.appendChild(cell);
  }
}

// date picker trigger
picker.onchange = (e) => {
  if (!e.target.value) return;
  const [y, m] = e.target.value.split('-');
  currentYear = parseInt(y);
  currentMonth = parseInt(m) - 1;
  render();
};

// swipe logic
let touchY = 0;
window.addEventListener('touchstart', e => touchY = e.touches[0].clientY);
window.addEventListener('touchend', e => {
  let diff = touchY - e.changedTouches[0].clientY;
  if (Math.abs(diff) > 60) {
    if (diff > 0) changeMonth(1);  // swipe up -> next month
    if (diff < 0) changeMonth(-1); // swipe down -> prev month
  }
});

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  render();
}

// modal launcher
function openDay(isoDate, monthDayStr) {
  document.getElementById('m-date').innerText = isoDate;
  
  const currentBox = document.getElementById('m-events');
  const historyBox = document.getElementById('m-history-events');
  
  currentBox.innerHTML = '';
  historyBox.innerHTML = '';
  
  // exact events
  const exact = events.filter(e => e.date === isoDate);
  if(exact.length === 0) {
    currentBox.innerHTML = '<p style="color:#666; font-size:13px;">No direct events.</p>';
  } else {
    exact.forEach(e => {
      currentBox.innerHTML += `
        <div class="event-item" style="border-color:${e.color}">
          <div style="font-weight:bold; color:${e.color}">${e.event}</div>
          <div style="font-size:12px; color:#aaa; margin-top:4px;">${e.extra}</div>
        </div>`;
    });
  }
  
  // on this day logic (match MM-DD but different year)
  const history = events.filter(e => e.date.endsWith(monthDayStr) && e.date !== isoDate);
  if(history.length === 0) {
    document.getElementById('m-history-box').style.display = 'none';
  } else {
    document.getElementById('m-history-box').style.display = 'block';
    history.forEach(e => {
      const yr = e.date.split('-')[0];
      historyBox.innerHTML += `
        <div class="event-item" style="border-color:#ffb300">
          <div style="font-weight:bold;"><span style="color:#ffb300">${yr}:</span> ${e.event}</div>
          <div style="font-size:12px; color:#aaa; margin-top:4px;">${e.extra}</div>
        </div>`;
    });
  }
  
  modal.style.display = 'block';
}

// tap outside close layout
modal.onclick = (e) => {
  if (e.target === modal) modal.style.display = 'none';
};
</script>
</body>
</html>
