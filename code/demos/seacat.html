<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEACAT</title>
<style>
:root[data-theme="dark"]{
  --bg:#080b0a; --panel:#0d1211; --panel2:#111817;
  --border:#20302c; --text:#cfe6df; --dim:#6b8b83;
  --accent:#4fd1b0; --warn:#e0a35a; --bad:#e06b5a; --good:#5fd39a;
  --water1:#0d3b35; --water2:#020a09;
  --fish:#4fae94; --fishLo:#3a8f79; --fishShade:#2c7562; --fishDark:#0b241f;
  --fishHi:#8fe0c8;
  --eye:#07100e; --whisker:#d3f2e8; --fin:#3f9c83; --finHi:#6fd0b2;
  --egg:#efe3c8; --eggShade:#c9b892; --crack:#7d6f50;
  --heart:#ff6b8a;
}
:root[data-theme="light"]{
  --bg:#eef2f0; --panel:#ffffff; --panel2:#f5f8f7;
  --border:#b4c5c0; --text:#132420; --dim:#5f7a73;
  --accent:#0f8a6e; --warn:#a86a15; --bad:#b23a26; --good:#14855e;
  --water1:#c6e8e1; --water2:#78bfb3;
  --fish:#2f8a72; --fishLo:#206b58; --fishShade:#175547; --fishDark:#062018;
  --fishHi:#8de0c5;
  --eye:#04100c; --whisker:#0f3a30; --fin:#20735f; --finHi:#5fbfa4;
  --egg:#ddcda6; --eggShade:#a89670; --crack:#6b5c3d;
  --heart:#d94a6a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{
  height:100dvh; max-height:100dvh; overflow:hidden;
  max-width:720px; margin:0 auto; padding:10px;
  display:flex; flex-direction:column; gap:8px;
}
header{
  flex:0 0 auto;
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--border); background:var(--panel);
  padding:7px 10px;
}
header h1{font-size:11px; letter-spacing:.32em; font-weight:600; color:var(--accent); flex:1;}
.chip{font-size:9px; letter-spacing:.18em; padding:3px 7px; border:1px solid var(--border); color:var(--dim);}
.chip.stage{color:var(--text); border-color:var(--accent)}
#theme{
  font-size:9px; letter-spacing:.18em; padding:3px 8px;
  border:1px solid var(--border); background:transparent;
  color:var(--dim); cursor:pointer;
}
#theme:hover{border-color:var(--accent); color:var(--accent)}
fieldset{
  border:1px solid var(--border); background:var(--panel);
  padding:8px 10px 10px; position:relative; min-width:0;
}
legend{
  font-size:9px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--dim); padding:0 6px; margin-left:2px;
}
#tankbox{flex:0 0 auto; padding:6px}
#tankbox legend{margin-left:6px}
.tankwrap{
  position:relative;
  width:min(100%, 640px, calc(34dvh * 4 / 3));
  aspect-ratio:4/3; margin:0 auto;
  border:1px solid var(--border);
  background:#000; overflow:hidden;
  cursor:pointer; touch-action:manipulation;
}
canvas{display:block; width:100%; height:100%}
#hint{
  position:absolute; left:0; right:0; bottom:8px; text-align:center;
  font-size:9px; letter-spacing:.28em; color:#9fe8d6;
  pointer-events:none; text-shadow:0 1px 3px #000;
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#overlay{
  position:absolute; inset:0; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  gap:10px; padding:20px; text-align:center;
  background:rgba(0,0,0,.8); color:#d7ece7;
}
#overlay.on{display:flex}
#overlay h2{font-size:11px; letter-spacing:.32em; color:var(--accent)}
#overlay p{font-size:11px; color:#a8ccc3; max-width:36ch; line-height:1.6}
#overlay button{
  font:inherit; font-size:10px; letter-spacing:.16em;
  padding:9px 14px; cursor:pointer;
  border:1px solid #4fd1b0; background:transparent; color:#4fd1b0;
}
#vitals{flex:0 0 auto; padding-bottom:8px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:6px 12px;}
.stat .top{display:flex; justify-content:space-between; font-size:9px; letter-spacing:.16em; color:var(--dim); margin-bottom:3px;}
.stat .top b{color:var(--text); font-weight:600}
.bar{height:6px; border:1px solid var(--border); background:var(--panel2)}
.bar i{display:block; height:100%; width:0; transition:width .25s linear}
#hints{margin-top:7px; padding-top:6px; border-top:1px dashed var(--border); font-size:10px; color:var(--dim); line-height:1.55;}
#hints .crit{color:var(--bad)}
#logbox{flex:1 1 auto; min-height:100px; display:flex; flex-direction:column; overflow:hidden;}
#log{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  display:flex; flex-direction:column; gap:5px;
  padding-right:2px; scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
#log::-webkit-scrollbar{width:6px}
#log::-webkit-scrollbar-thumb{background:var(--border)}
.msg{font-size:11.5px; line-height:1.5; padding:6px 9px; border:1px solid var(--border); max-width:88%; white-space:pre-wrap; word-break:break-word;}
.msg.you{align-self:flex-end; background:var(--panel2); color:var(--dim)}
.msg.pet{align-self:flex-start; border-left:3px solid var(--accent); background:var(--panel2)}
.msg.sys{align-self:center; border-style:dashed; background:transparent; color:var(--dim); font-size:9px; letter-spacing:.14em; text-transform:uppercase; text-align:center; max-width:96%;}
.dots{display:inline-flex; gap:4px; height:12px; align-items:center}
.dots i{width:4px; height:4px; background:var(--accent); animation:p 1.1s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes p{0%,100%{opacity:.2}40%{opacity:1}}
#ctrlbox{flex:0 0 auto; display:flex; flex-direction:column; gap:8px}
.row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
button{
  font:inherit; font-size:10px; letter-spacing:.14em;
  padding:8px 11px; cursor:pointer;
  border:1px solid var(--border); background:var(--panel2);
  color:var(--text);
}
button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
button:active:not(:disabled){background:var(--accent); color:var(--bg)}
button:disabled{opacity:.35; cursor:default}
#tempval{min-width:52px; text-align:center; font-size:13px; font-weight:600; border:1px solid var(--border); padding:7px 8px; background:var(--panel2);}
#say{display:flex; gap:6px}
#say input{
  flex:1; min-width:0; font:inherit; font-size:12px;
  padding:9px 10px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); outline:none;
}
#say input:focus{border-color:var(--accent)}
#say input::placeholder{color:var(--dim)}
#say input:disabled{opacity:.4}
#say button{padding:9px 16px}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>SEACAT</h1>
    <span class="chip stage" id="stage">EGG</span>
    <span class="chip" id="day">DAY 1</span>
    <button id="theme" type="button">LIGHT</button>
  </header>

  <fieldset id="tankbox">
    <legend>tank</legend>
    <div class="tankwrap" id="tankwrap">
      <canvas id="cv" width="640" height="480"></canvas>
      <div id="hint">TAP THE EGG</div>
      <div id="overlay">
        <h2 id="ov-title"></h2>
        <p id="ov-text"></p>
        <button id="ov-btn" type="button">START OVER</button>
      </div>
    </div>
  </fieldset>

  <fieldset id="vitals">
    <legend>vitals</legend>
    <div class="stats" id="stats"></div>
    <div id="hints"></div>
  </fieldset>

  <fieldset id="logbox">
    <legend>log</legend>
    <div id="log"></div>
  </fieldset>

  <fieldset id="ctrlbox">
    <legend>controls</legend>
    <div class="row">
      <button id="t-" type="button">− TEMP</button>
      <div id="tempval">55°</div>
      <button id="t+" type="button">+ TEMP</button>
      <button id="feed" type="button">FEED</button>
      <button id="clean" type="button">CLEAN</button>
    </div>
    <div id="say">
      <input id="input" placeholder="talk to it..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="send" type="button">SEND</button>
    </div>
  </fieldset>

</div>

var MOODS = ["happy","neutral","annoyed","sick"];
var STAGE_TAGS = {juv:"JUVENILE",adult:"ADULT",elder:"ELDER"};

function parseLine(raw){
  var m = /^\[([^\]]+)\]\s*([\s\S]*)$/.exec(raw);
  if(!m) return {text:raw, moods:[], stages:[]};
  var tags = m[1].split(",").map(function(s){return s.trim().toLowerCase();});
  var moods = tags.filter(function(t){return MOODS.indexOf(t)>=0;});
  var stages = tags.filter(function(t){return STAGE_TAGS[t];}).map(function(t){return STAGE_TAGS[t];});
  return {text:m[2], moods:moods, stages:stages};
}

var BANK = {};
for(var k in RAW){ BANK[k] = RAW[k].map(parseLine); }

var used = {};
function pickLine(bucket, mood, stage){
  var all = BANK[bucket] || BANK.unknown;
  var pool = all.filter(function(l){
    return (!l.moods.length || l.moods.indexOf(mood)>=0) &&
           (!l.stages.length || l.stages.indexOf(stage)>=0);
  });
  if(!pool.length) pool = all.filter(function(l){return !l.moods.length && !l.stages.length;});
  if(!pool.length) pool = all;
  var fresh = pool.filter(function(l){return !used[l.text];});
  if(!fresh.length){ pool.forEach(function(l){ delete used[l.text]; }); fresh = pool; }
  var line = fresh[Math.floor(Math.random()*fresh.length)];
  used[line.text] = 1;
  var keys = Object.keys(used);
  if(keys.length > 70) delete used[keys[0]];
  return line.text;
}

   2. BUCKET ROUTER
   ========================================================= */
function bucketFor(text){
  var t = " " + text.toLowerCase() + " ";
  function has(re){return re.test(t);}
  if(has(/\b(die|death|dead|kill|funeral|gone forever)\b/)) return "death";
  if(has(/\b(stupid|dumb|ugly|hate you|shut up|annoying|idiot|useless|loser)\b/)) return "insult";
  if(has(/\b(love|adore|miss you|care about|friend|cute)\b/)) return "love";
  if(has(/\b(good|great|nice|best|pretty|smart|clever|beautiful|amazing|proud)\b/)) return "praise";
  if(has(/\b(food|eat|feed|fed|hungry|hunger|snack|dinner|meal|pellet|flake|starving)\b/)) return "food";
  if(has(/\b(temp|temperature|hot|cold|warm|heat|freezing|boiling|degree)\b/)) return "temp";
  if(has(/\b(clean|dirty|filth|wash|algae|murky|filter|tank|water)\b/)) return "clean";
  if(has(/\b(hi|hello|hey|yo|sup|morning|evening|greetings)\b/)) return "greeting";
  if(has(/\b(weather|rain|raining|sun|sunny|snow|storm|sky|outside|cloud|wind)\b/)) return "weather";
  if(has(/\b(bored|boring|nothing to do|dull|again)\b/)) return "boredom";
  if(has(/\b(who are you|what are you|your name|seapussy|cat|fish|creature)\b/)) return "self";
  if(has(/\b(life|meaning|exist|existence|purpose|soul|universe|conscious)\b/)) return "life";
  if(t.indexOf("?")>=0 || has(/\b(who|what|when|where|why|how|do you|can you|are you|will you)\b/)) return "question";
  return "unknown";
}

var AC = null;
var audioReady = false;
function initAudio(){
  if(audioReady){
    if(AC && AC.state === "suspended" && AC.resume) AC.resume();
    return;
  }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    audioReady = true;
  } catch(e){ audioReady = false; }
}
function tone(freq, dur, type, vol){
  if(!audioReady || !AC) return;
  try {
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    var t0 = AC.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.04, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

function fitCanvas(){

  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  var sx = cv.width / VW;

  ctx.setTransform(sx, 0, 0, sy, 0, 0);

function moodTint(){
  if(S.dead || S.ending === "quiet") return "rgba(130,140,140,0.20)";
  if(S.ending === "ascension") return "rgba(90,180,255,0.14)";
  if(S.health < 40) return "rgba(140,150,150,0.16)";
  if(S.temp < 45 || S.temp > 65) return "rgba(200,70,55,0.18)";
  if(S.mood === "happy") return "rgba(70,220,150,0.10)";
  if(S.mood === "annoyed") return "rgba(210,130,60,0.10)";
  return "rgba(40,140,130,0.06)";

function drawBackground(t){
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, COL.water1);
  g.addColorStop(1, COL.water2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = "lighter";
  for(var i=0;i<4;i++){
    var phase = (t*0.05 + i*0.25) % 1;
    var y = phase * (VH + 120) - 60;
    var h = 16 + Math.sin(t*0.8 + i*1.7)*8;
    var lg = ctx.createLinearGradient(0, y-h, 0, y+h);
    lg.addColorStop(0, "rgba(0,0,0,0)");
    lg.addColorStop(0.5, "rgba(255,255,255,0.06)");
    lg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = lg;
    ctx.fillRect(0, y-h, VW, h*2);
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawBubbles(dt){
  if(!S.dead && Math.random() < dt*1.2){
    bubbles.push({
      x: 30 + Math.random()*(VW-60),
      y: VH + 8,
      r: 1.5 + Math.random()*3,
      v: 28 + Math.random()*42,
      ph: Math.random()*6.28
    });
  }
  for(var i=bubbles.length-1;i>=0;i--){
    var b = bubbles[i];
    b.y -= b.v*dt;
    if(b.y < -10){ bubbles.splice(i,1); continue; }
    var bx = b.x + Math.sin(b.y*0.03 + b.ph)*6;
    ctx.beginPath();
    ctx.arc(bx, b.y, b.r, 0, 6.2832);
    ctx.strokeStyle = "rgba(220,255,245,0.32)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawRipples(dt){
  for(var i=ripples.length-1;i>=0;i--){
    var r = ripples[i];
    r.r += (r.max - r.r) * 0.1;
    r.life -= dt*1.1;
    if(r.life <= 0){ ripples.splice(i,1); continue; }
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, 6.2832);
    ctx.strokeStyle = "rgba(160,255,230," + (0.4*r.life) + ")";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawHearts(dt){
  for(var i=hearts.length-1;i>=0;i--){
    var h = hearts[i];
    h.y -= 42*dt;
    h.x += Math.sin(h.y*0.05 + h.ph) * 0.4;
    h.life -= dt*0.7;
    if(h.life <= 0){ hearts.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, h.life * 1.4);
    ctx.translate(h.x, h.y);
    ctx.scale(h.size, h.size);
    ctx.fillStyle = COL.heart;
    ctx.beginPath();
    ctx.arc(-3, -3, 3, 0, 6.2832);
    ctx.arc(3, -3, 3, 0, 6.2832);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, -2);
    ctx.lineTo(0, 6);
    ctx.lineTo(6, -2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawEgg(t){

  ctx.save();
  ctx.translate(cx, cy + bob);
  ctx.beginPath();
  ctx.ellipse(0, 4, 64, 82, 0, 0, 6.2832);
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.fill();
  var sg = ctx.createRadialGradient(-20, -28, 6, 0, 0, 90);
  sg.addColorStop(0, "#fbf3e2");
  sg.addColorStop(1, COL.eggShade);
  ctx.beginPath();
  ctx.ellipse(0, 0, 62, 80, 0, 0, 6.2832);
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.strokeStyle = COL.eggShade;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = "rgba(140,120,80,0.14)";
  for(var i=0;i<8;i++){
    var a = i * 0.9 + 0.4;
    var rx = Math.cos(a)*32;
    var ry = Math.sin(a)*42 + 4;
    ctx.beginPath();
    ctx.arc(rx, ry, 2 + (i%3), 0, 6.2832);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(-20, -30, 14, 20, -0.4, 0, 6.2832);
  ctx.fillStyle = "rgba(255,255,255,0.42)";
  ctx.fill();
  var cracks = [
    [[-14,-26],[-3,-12],[-14,-2]],
    [[-14,-2],[4,7],[-3,22]],
    [[-3,22],[15,30]],
    [[-3,-12],[11,-18],[22,-7]]
  ];
  ctx.strokeStyle = COL.crack;
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  for(var j=0;j<eggCrack && j<cracks.length;j++){
    var p = cracks[j];
    ctx.beginPath();
    ctx.moveTo(p[0][0], p[0][1]);
    for(var m=1;m<p.length;m++) ctx.lineTo(p[m][0], p[m][1]);
    ctx.stroke();
  }
  ctx.restore();
}

  ctx.fill();

  if(mood === "happy" && !S.dead){
    ctx.beginPath();
    ctx.ellipse(-20, 14, 10, 5, 0, 0, 6.2832);
    ctx.fillStyle = "rgba(255,150,170,0.28)";
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(50, 14, 10, 5, 0, 0, 6.2832);
    ctx.fillStyle = "rgba(255,150,170,0.28)";
    ctx.fill();
  }

  /* EYES */
  var eyeOpen = (blinking > 0 && !S.dead) ? 0.12 : 1;
  function drawEye(ex, ey, isLeft){
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(1, eyeOpen);
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 13, 0, 0, 6.2832);
    ctx.fillStyle = "#fbf6e7";
    ctx.fill();
    ctx.strokeStyle = COL.fishDark;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    var lookX = isLeft ? -1 : 1;
    ctx.beginPath();
    ctx.ellipse(lookX*1.5, 1, 6, 9, 0, 0, 6.2832);
    ctx.fillStyle = COL.eye;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-2.5, -3.5, 2.2, 0, 6.2832);
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fill();
    ctx.restore();
  }
  drawEye(-6, -8, true);
  drawEye(34, -8, false);

  /* MOUTH — neutral */
  ctx.beginPath();
  ctx.moveTo(2, 24);
  ctx.lineTo(28, 24);
  ctx.strokeStyle = COL.fishDark;
  ctx.lineWidth = 2.6;
  ctx.lineCap = "round";
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(14, 20);
  ctx.lineTo(16, 20);
  ctx.strokeStyle = COL.fishDark;
  ctx.lineWidth = 2;
  ctx.stroke();

  /* WHISKERS */
  if(S.stage !== "FRY"){
    ctx.strokeStyle = COL.whisker;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    for(var wi=0; wi<3; wi++){
      var dy = -14 + wi*13;
      ctx.beginPath();
      ctx.moveTo(-38, 4 + wi*6);
      ctx.quadraticCurveTo(-70, dy*0.6, -104, dy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(66, 4 + wi*6);
      ctx.quadraticCurveTo(96, dy*0.6, 128, dy);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawTank(t, dt){
  drawBackground(t);
  drawBubbles(dt);
  if(!S.hatched) drawEgg(t);
  else drawCreature(t);
  ctx.fillStyle = moodTint();
  ctx.fillRect(0, 0, VW, VH);
  drawRipples(dt);
  drawHearts(dt);
}

/* =========================================================

function addMsg(who, text, dots){
  var el = document.createElement("div");
  el.className = "msg " + who;
  if(dots){
    el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';

/* =========================================================
   9. MEMORY
   ========================================================= */
var STOP = {};
("the a an and or but if then than that this these those i you he she it we they me my your his her its our "+
 "their to of in on at for with about from is are was were be been being am do does did have has had will "+
 "would can could should shall may might must not no yes so just really very much many some any what when "+
 "where who why how there here again also too only own same because while into over under out up down off")
.split(/\s+/).forEach(function(w){ STOP[w] = 1; });

function extractNoun(text){
  var words = text.toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(Boolean);
  var best = null;
  for(var i=0;i<words.length;i++){
    var w = words[i];
    if(w.length < 4 || STOP[w]) continue;
    if(!best || w.length > best.length) best = w;
  }
  return best;
}
function remember(text){
  memory.push({text:text, noun:extractNoun(text)});
  if(memory.length > 5) memory.shift();
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* =========================================================
   10. REPLY GENERATION
   ========================================================= */
function generateReply(playerText){
  var mood = S.mood, stage = S.stage;
  var out = [];

  if(S.drift){
    out.push(pick(BANK.drift).text);
    return out;
  }

  /* fish asked something → deepen */
  if(pendingDeep && Math.random() < 0.8){
    out.push(pickLine("deepen", mood, stage));
    pendingDeep = false;
  } else {
    if(Math.random() < 0.15){
      out.push(pickLine("selfabsorbed", mood, stage));
    } else {
      out.push(pickLine(bucketFor(playerText), mood, stage));
    }
  }

  if(Math.random() < 0.22){
    out.push(pickLine("undercut", mood, stage));
  } else if(Math.random() < 0.15){
    out.push(pickLine("ramble", mood, stage));
  }

  var nouns = memory.filter(function(m){return m.noun;}).map(function(m){return m.noun;});
  if(nouns.length && Math.random() < 0.14 && out.length < 3){
    var n = pick(nouns);
    out.push(pick(MEMORY)(n));
  }

  /* Sometimes the fish asks a real question back */
  if(Math.random() < 0.35 && out.length < 3 && stage !== "FRY"){
    var q = pickLine("initiate", mood, stage);
    if(q.indexOf("?") >= 0){
      out.push(q);
      pendingDeep = true;
    }
  }

  return out.slice(0,3);
}

/* =========================================================
   11. SPEAKING
   ========================================================= */
function speakLines(lines, done){
  if(!lines.length){ if(done) done(); return; }
  S.thinking = true;
  updateLock();
  var i = 0;
  function step(){
    if(i >= lines.length){
      S.thinking = false;
      recentReplyAt = Date.now();
      updateLock();
      if(done) done();
      return;
    }
    addMsg("pet", lines[i++]);
    sfxTalk();
    setTimeout(step, 500 + Math.random()*400);
  }
  setTimeout(step, 260);
}

function thinkAndReply(playerText){
  if(S.dead || S.ending) return;
  if(Date.now() < ignoreUntil) return;

  var sinceReply = Date.now() - recentReplyAt;
  if(sinceReply < 900) rapidCount++;
  else rapidCount = 0;

  if(rapidCount >= 2){
    rapidCount = 0;
    if(!queuedFollowUp){
      queuedFollowUp = true;
      setTimeout(function(){
        queuedFollowUp = false;
        addMsg("pet", pickLine("dismiss", S.mood, S.stage));
        sfxTalk();
        ignoreUntil = Date.now() + 10000;
        updateLock();
      }, 900);
      return;
    }
  }

  if(S.stage === "EGG") return;

  /* FRY — short but REAL sentences */
  if(S.stage === "FRY"){
    S.thinking = true;
    updateLock();
    var dots = addMsg("pet", "", true);
    setTimeout(function(){
      dots.remove();
      var line = Math.random() < 0.85
        ? pick(BANK.fry).text
        : pick(BANK.squeak).text;
      addMsg("pet", line);
      sfxTalk();
      S.thinking = false;
      recentReplyAt = Date.now();
      updateLock();
    }, 550 + Math.random()*450);
    return;
  }

  var words = playerText.split(/\s+/).filter(Boolean).length;
  var thinkMs = Math.min(3500, 900 + 120*words);

  S.thinking = true;
  updateLock();
  var dotsEl = addMsg("pet", "", true);

  setTimeout(function(){
    dotsEl.remove();
    var bubbles = generateReply(playerText);
    var i = 0;
    function step(){
      if(i >= bubbles.length){
        S.thinking = false;
        recentReplyAt = Date.now();
        updateLock();
        return;
      }
      addMsg("pet", bubbles[i++]);
      sfxTalk();
      setTimeout(step, 450 + Math.random()*300);
    }
    step();
  }, thinkMs);
}

/* =========================================================
   12. PLAYER INPUT
   ========================================================= */
function send(){
  if(S.dead || S.ending || S.thinking || Date.now() < ignoreUntil) return;
  var text = (inputEl.value || "").trim();
  if(!text) return;

  initAudio();
  sfxClick();

  inputEl.value = "";
  addMsg("you", text);
  lastInteract = Date.now();

  var words = text.split(/\s+/).filter(Boolean).length;
  S.wordCount += words;
  S.bond = clamp(S.bond + words*0.4, 0, 100);

  remember(text);
  updateStage();
  render();

  if(Date.now() < ignoreUntil) return;
  thinkAndReply(text);
}

function updateLock(){
  var lock = S.thinking || S.dead || !!S.ending || Date.now() < ignoreUntil;
  inputEl.disabled = lock;
  sendBtn.disabled = lock;
}

/* =========================================================
   13. EVOLUTION — lower thresholds
   ========================================================= */
function updateStage(){
  if(!S.hatched || S.stage === "EGG") return;
  var wc = S.wordCount;
  var s = "FRY";
  if(wc >= THRESH.ELDER) s = "ELDER";
  else if(wc >= THRESH.ADULT) s = "ADULT";
  else if(wc >= THRESH.JUVENILE) s = "JUVENILE";
  else s = "FRY";

  if(STAGES.indexOf(s) > STAGES.indexOf(S.stage)){
    var from = S.stage;
    S.stage = s;
    onEvolve(from, s);
  }
}

function onEvolve(from, to){
  var lines = {
    FRY: "(the shell splits. something small and already annoyed looks at you)",
    JUVENILE: "Okay. Words. I have words now. That's new. Hi.",
    ADULT: "Right. I have opinions now. You should sit down for this.",
    ELDER: "I'm old. That happened fast. Let me tell you what I've figured out."
  };
  if(lines[to]){ addMsg("pet", lines[to]); sfxTalk(); }
  /* prompt him to speak again shortly */
  nextInitiate = Date.now() + 5000;
}

/* =========================================================

function tapEgg(x, y){
  if(S.dead || S.ending) return;
  initAudio();
  lastInteract = Date.now();
  ripples.push({x:x, y:y, r:2, max:150, life:1});
  var cx = VW/2, cy = VH/2 + 8;

  S.taps++;
  eggCrack = Math.min(4, S.taps);
  sfxEggTap();
  render();
  if(S.taps >= 5) hatch();

function caress(x, y){
  if(S.dead || S.ending) return;
  initAudio();
  var now = Date.now();
  if(now - lastCaress < 320) return;
  lastCaress = now;
  lastInteract = now;

  S.bond = clamp(S.bond + 0.7, 0, 100);
  fish.petAnim = 0.7;

  for(var i=0;i<4;i++){
    hearts.push({
      x: fish.x + (Math.random()-0.5)*90,
      y: fish.y - 10 + Math.random()*40,
      life: 1,
      size: 0.9 + Math.random()*0.7,

    });
  }

  sfxPet();
  render();

  if(Math.random() < 0.18 && !S.thinking && S.stage !== "EGG" && S.stage !== "FRY"){
    setTimeout(function(){
      if(S.dead || S.ending || S.thinking) return;
      if(S.drift){ addMsg("pet", pick(BANK.drift).text); }
      else { addMsg("pet", pickLine("love", S.mood, S.stage)); }

}

function hatch(){

  S.hatched = true;
  S.stage = "FRY";

  fish.x = VW/2; fish.y = VH/2 + 8;

  sfxHatch();
  render();

  addMsg("sys", "it hatched");
  addMsg("pet", "(the shell splits. something small and already annoyed looks at you)");
  setTimeout(function(){ addMsg("pet", pick(BANK.fry).text); sfxTalk(); }, 800);
  setTimeout(function(){ addMsg("sys", "talk to him — he'll talk back"); }, 1600);

  /* fish speaks up quickly after hatch */
  nextInitiate = Date.now() + 7000;
}

/* =========================================================
   16. FISH MOVEMENT
   ========================================================= */
function updateFish(dt, t){
  if(!S.hatched) return;
  var baseScale = {FRY:0.52, JUVENILE:0.70, ADULT:0.88, ELDER:1.0}[S.stage] || 1;
  fish.currentScale = baseScale * (S.scale || 1);

  if(S.ending === "ascension"){
    fish.x += 90*dt;
    fish.pitch = -0.15;
    return;
  }
  if(S.dead){
    fish.pitch += (0.55 - fish.pitch) * Math.min(1, dt*2);
    fish.y += (VH/2 + 90 - fish.y) * Math.min(1, dt*0.6);
    return;
  }

  if(fish.petAnim > 0) fish.petAnim -= dt;

  fish.retarget -= dt;
  if(fish.retarget <= 0 || Math.hypot(fish.tx - fish.x, fish.ty - fish.y) < 12){
    var pad = 110;
    fish.tx = pad + Math.random()*(VW - pad*2);
    fish.ty = 90 + Math.random()*(VH - 200);
    fish.retarget = 3.5 + Math.random()*4.5;
  }

  var dx = fish.tx - fish.x;
  var dy = fish.ty - fish.y;
  var d = Math.hypot(dx, dy);
  var speed = 42 + (S.mood === "happy" ? 22 : 0) + (S.mood === "annoyed" ? -12 : 0);
  if(d > 3){
    var step = Math.min(d, speed * dt);
    fish.x += (dx/d) * step;
    fish.y += (dy/d) * step;
    fish.vy = (dy/d) * speed;
    if(Math.abs(dx) > 6) fish.facing = dx > 0 ? 1 : -1;
  } else {
    fish.vy *= 0.85;
  }
  fish.x = Math.max(70, Math.min(VW-70, fish.x));
  fish.y = Math.max(80, Math.min(VH-60, fish.y));

  var targetPitch = clamp(fish.vy * 0.006, -0.25, 0.25);
  fish.pitch += (targetPitch - fish.pitch) * Math.min(1, dt*3);
}

/* =========================================================
   17. FISH SELF-INITIATION — the big fix
   ========================================================= */
function doInitiate(){
  if(S.dead || S.ending || S.thinking) return;

  var idle = Date.now() - lastInteract;
  var lines = [];

  if(S.drift){
    lines = [pick(BANK.drift).text];
  } else if(S.stage === "FRY"){
    /* FRY: small but real */
    lines = [pick(BANK.fry).text];
    if(Math.random() < 0.35) lines.push(pick(BANK.fry).text);
  } else if(idle > 120000){
    /* he's been alone a long time — hurt */
    lines = [pickLine("silence", S.mood, S.stage)];
    if(Math.random() < 0.6) lines.push(pickLine("initiate", S.mood, S.stage));
  } else if(idle > 45000){
    /* he's starting to notice */
    lines = [pickLine("initiate", S.mood, S.stage)];
    if(Math.random() < 0.55) lines.push(pickLine("selfabsorbed", S.mood, S.stage));
  } else if(idle > 15000){
    /* just hanging out */
    if(Math.random() < 0.55){
      var q = pickLine("initiate", S.mood, S.stage);
      lines.push(q);
      if(q.indexOf("?") >= 0) pendingDeep = true;
      if(Math.random() < 0.35) lines.push(pickLine("initiate", S.mood, S.stage));
    } else {
      lines.push(pickLine("selfabsorbed", S.mood, S.stage));
    }
  } else {
    /* recently talked — small musing */
    if(Math.random() < 0.5){
      lines.push(pickLine("selfabsorbed", S.mood, S.stage));
    } else {
      return;
    }
  }

  if(!lines.length) return;
  speakLines(lines);

  /* next initiate time — faster if idle longer */
  var base;
  if(S.stage === "FRY") base = 20000;
  else if(idle > 60000) base = 18000;
  else base = 26000;
  nextInitiate = Date.now() + base + Math.random()*14000;
}

function tickInitiate(){
  if(!S.hatched || S.dead || S.ending || S.thinking) return;
  if(S.stage === "EGG") return;
  if(Date.now() < nextInitiate) return;
  doInitiate();
}

/* =========================================================
   18. ENDINGS
   ========================================================= */
function checkEndings(){
  if(S.dead || S.ending) return;
  if(S.day >= 30){
    if(S.bond >= 70 && S.health >= 60 && !S.drift){ startAscension(); return; }
    if(S.bond < 40 && !S.drift){
      S.drift = true;
      addMsg("pet", "I've stopped keeping track. It's easier.");
    }
  }
}

function die(){
  if(S.dead) return;
  S.dead = true;
  S.health = 0;
  S.thinking = false;
  render();
  updateLock();

  var line = S.bond >= 60
    ? "Oh. Okay. That's — okay. You did alright, you know. I'd have liked a bit more time. Not with anyone else. Just more."
    : "Well. There it is. You were somewhere else. That's fine. It's fine. It was always going to be fine.";

  addMsg("pet", line);
  tone(260, 0.5, "sine", 0.05);

  setTimeout(function(){
    ovTitle.textContent = "THE QUIET";
    ovText.textContent = "He is not moving. The filter is still running. That's the worst part.";
    overlay.classList.add("on");
  }, 2600);
}

function startAscension(){
  if(S.ending) return;
  S.ending = "ascension";
  S.thinking = false;
  render();
  updateLock();

  var mono = [
    "Alright. Listen. I'm going.",
    "Not dying. Going. There's a difference and I'm not going to explain it to you.",
    "The tank's fine. The filter's fine. You'll be fine — that last one is the one I'm least sure about.",
    "You know, you're alright. Don't let it go to your head."
  ];
  var i = 0;
  function step(){
    if(i < mono.length){
      addMsg("pet", mono[i++]);
      sfxTalk();
      setTimeout(step, 1500);
    } else {
      setTimeout(function(){
        ovTitle.textContent = "THE ASCENSION";
        ovText.textContent = "He swam out through a door that wasn't there. The water is blue and empty and still yours.";
        overlay.classList.add("on");
      }, 1600);
    }
  }
  step();
}

/* =========================================================

function restart(){

  S.temp = 55; S.hunger = 20; S.filth = 10; S.bond = 5; S.health = 100;
  S.mood = "neutral"; S.thinking = false; S.dead = false; S.ending = null;

  used = {}; recentReplyAt = 0; rapidCount = 0; ignoreUntil = 0;

/* =========================================================
   20. RENDER
   ========================================================= */
function clamp(v, a, b){
  if(a === undefined) a = 0;
  if(b === undefined) b = 100;
  return v < a ? a : v > b ? b : v;
}

function computeMood(){
  if(S.dead) return "dead";
  if(S.health < 40) return "sick";
  var badTemp = S.temp < 45 || S.temp > 65;
  if(badTemp || S.hunger > 72 || S.filth > 72) return "annoyed";
  if(S.health > 70 && S.hunger < 45 && S.filth < 45 && S.bond > 45) return "happy";
  return "neutral";
}

function barColor(good){
  var g = clamp(good, 0, 1);
  var hue = 6 + g*140;
  return "hsl(" + hue + " 62% 50%)";
}

function computeHints(){
  var h = [];
  if(S.temp < 45) h.push({t:"Too cold — he is sluggish and pale.", c:true});
  else if(S.temp > 65) h.push({t:"Too warm — he is hovering near the surface, glaring.", c:true});
  else h.push({t:"Temperature is in band. He has stopped complaining."});

  if(S.hunger > 75) h.push({t:"Starving — he keeps staring at you.", c:true});
  else if(S.hunger > 45) h.push({t:"Getting hungry — he is chewing the filter intake."});

  if(S.filth > 75) h.push({t:"Tank is filthy — he is refusing to look at you.", c:true});
  else if(S.filth > 45) h.push({t:"Cloudy — he has started naming the algae."});

  if(S.health < 35) h.push({t:"Health failing — he is lying on the bottom.", c:true});
  else if(S.health < 70) h.push({t:"Not well — his fins are moving slower."});

  return h;
}

function render(){
  S.mood = computeMood();
  stageEl.textContent = S.stage;
  dayEl.textContent = "DAY " + S.day;

  var vals = { temp:S.temp, hunger:S.hunger, filth:S.filth, bond:S.bond, health:S.health };
  var colors = {
    temp: (function(){
      var d = S.temp < 45 ? 45 - S.temp : S.temp > 65 ? S.temp - 65 : 0;
      return barColor(1 - clamp(d/22, 0, 1));
    })(),
    hunger: barColor(1 - S.hunger/100),
    filth: barColor(1 - S.filth/100),
    bond: barColor(S.bond/100),
    health: barColor(S.health/100)
  };

  STAT_DEFS.forEach(function(def){
    var el = statEls[def.k];
    var v = vals[def.k];
    var disp = def.k === "temp" ? Math.round(v) + "°" : Math.round(v);
    el.val.textContent = disp;
    el.fill.style.width = clamp((v/def.max)*100, 0, 100) + "%";
    el.fill.style.background = colors[def.k];
  });

  tempValEl.textContent = Math.round(S.temp) + "°";
  tempValEl.style.color = colors.temp;

  var hints = computeHints();
  var html = "";
  for(var i=0;i<hints.length;i++){
    html += "<div" + (hints[i].c ? ' class="crit"' : "") + ">" + hints[i].t + "</div>";
  }
  hintsEl.innerHTML = html;

  hintEl.style.display = (!S.hatched && !S.dead && !S.ending) ? "block" : "none";
  updateLock();
}

/* =========================================================
   21. TICK
   ========================================================= */
function tick(dt){
  if(!S.dead && !S.ending){
    S.temp += (AMBIENT - S.temp) * 0.0025 * dt;
    S.hunger = clamp(S.hunger + 0.28*dt, 0, 100);
    S.filth  = clamp(S.filth  + 0.20*dt, 0, 100);

    var dist = S.temp < 45 ? 45 - S.temp : S.temp > 65 ? S.temp - 65 : 0;
    var drain = 0;
    if(dist > 0) drain += Math.min(1, dist/20) * 0.55;
    if(S.hunger > 75) drain += ((S.hunger - 75)/25) * 0.4;
    if(S.filth  > 75) drain += ((S.filth  - 75)/25) * 0.4;

    if(drain > 0) S.health = clamp(S.health - drain*dt, 0, 100);
    else if(S.hunger < 60 && S.filth < 60) S.health = clamp(S.health + 0.22*dt, 0, 100);

    var good = dist === 0 && S.hunger < 55 && S.filth < 55 && S.health > 60;
    S.bond = clamp(S.bond + (good ? 0.05 : -0.015)*dt, 0, 100);

    dayTimer += dt;
    if(dayTimer >= DAY_SECONDS){
      dayTimer -= DAY_SECONDS;
      S.day++;
      checkEndings();
    }

    if(S.health <= 0) die();
  }

  S.scale += (1 - S.scale) * Math.min(1, dt*2.2);

  if(blinking > 0) blinking -= dt;
  else {
    blinkTimer -= dt;
    if(blinkTimer <= 0){
      blinking = 0.13;
      blinkTimer = 2.5 + Math.random()*4;
    }
  }

  tickInitiate();

  syncTimer += dt;
  if(syncTimer > 0.3){
    syncTimer = 0;
    render();
  }
}

/* =========================================================
   22. LOOP
   ========================================================= */
var lastT = performance.now();
function loop(now){
  var dt = Math.min(0.06, (now - lastT)/1000);
  lastT = now;
  var t = now/1000;
  tick(dt);
  updateFish(dt, t);
  drawTank(t, dt);
  requestAnimationFrame(loop);
}

/* =========================================================
   23. EVENTS
   ========================================================= */
cv.addEventListener("pointerdown", function(e){
  e.preventDefault();
  initAudio();
  var r = cv.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width * VW;
  var y = (e.clientY - r.top) / r.height * VH;

  if(!S.hatched){ tapEgg(x, y); return; }

  var sc = fish.currentScale || 1;
  var dx = x - fish.x;
  var dy = y - fish.y;
  var rad = 140 * sc;
  if(dx*dx + dy*dy < rad*rad){ caress(x, y); return; }

  ripples.push({x:x, y:y, r:2, max:100, life:0.7});
  sfxClick();
});

inputEl.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

document.getElementById("t-").addEventListener("click", tempDown);
document.getElementById("t+").addEventListener("click", tempUp);
document.getElementById("feed").addEventListener("click", feed);
document.getElementById("clean").addEventListener("click", clean);
ovBtn.addEventListener("click", function(){ initAudio(); sfxClick(); restart(); });

themeBtn.addEventListener("click", function(){
  initAudio(); sfxClick();
  var cur = document.documentElement.dataset.theme;
  var next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  themeBtn.textContent = next === "dark" ? "LIGHT" : "DARK";
  readColors();
  try { localStorage.setItem("seapussy-theme", next); } catch(err){}
});

try {
  var saved = localStorage.getItem("seapussy-theme");
  if(saved === "light" || saved === "dark"){
    document.documentElement.dataset.theme = saved;
    themeBtn.textContent = saved === "dark" ? "LIGHT" : "DARK";
  }
} catch(err){}

var hiddenAt = Date.now();
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(S.dead || S.ending || S.stage === "EGG") return;
  var away = Date.now() - hiddenAt;
  if(away > 25000 && !S.thinking){
    if(S.stage === "FRY") addMsg("pet", pick(BANK.fry).text);
    else if(S.drift) addMsg("pet", pick(BANK.drift).text);
    else addMsg("pet", pickLine("silence", S.mood, S.stage));
    sfxTalk();
  }
});

function onResize(){ fitCanvas(); }
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", function(){ setTimeout(onResize, 120); });
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", onResize);
}

/* =========================================================
   24. BOOT
   ========================================================= */
readColors();
fitCanvas();
render();
addMsg("sys", "a single egg sits in the tank. tap it.");
requestAnimationFrame(function(now){
  lastT = now;
  requestAnimationFrame(loop);
});

})();
</script>
