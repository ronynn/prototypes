<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
    background: #000;
    margin: 0;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Press Start 2P', Arial;
    overflow: hidden;
    user-select: none;
    touch-action: none;
}
.wrapper {
    width: 75vh;
    height: 100vh;
    max-width: 480px;
    max-height: 640px;
    position: relative;
    background: #000;
    overflow: hidden;
}
canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    display: block;
}
</style>
</head>
<body>

<div class="wrapper">
    <canvas id="game" width="480" height="640"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const THEMES = {
    gruvbox: { bg: "#282828", hide: "#3c3836", rev: "#ebdbb2", act: "#fe8019", text: "#fbf1c7", mine: "#fb4934", num: ["#458588","#b8bb26","#fabd2f","#d3869b"] },
    nord: { bg: "#2e3440", hide: "#434c5e", rev: "#d8dee9", act: "#88c0d0", text: "#eceff4", mine: "#bf616a", num: ["#81a1c1","#a3be8c","#ebcb8b","#b48ead"] },
    catpuccin: { bg: "#303446", hide: "#414559", rev: "#c6d0f5", act: "#ea999c", text: "#c6d0f5", mine: "#e78284", num: ["#8ca0f3","#a6d189","#e5c890","#ca9ee6"] },
    monokai: { bg: "#272822", hide: "#3e3d32", rev: "#f92672", act: "#a6e22e", text: "#f8f8f2", mine: "#f92672", num: ["#66d9ef","#a6e22e","#fd971f","#ae81ff"] },
    dracula: { bg: "#282a36", hide: "#44475a", rev: "#f8f8f2", act: "#bd93f9", text: "#f8f8f2", mine: "#ff5555", num: ["#8be9fd","#50fa7b","#ffb86c","#ff79c6"] },
    themeforest: { bg: "#212121", hide: "#333333", rev: "#ffffff", act: "#82b440", text: "#ffffff", mine: "#ff3d00", num: ["#00b0ff","#82b440","#ff9100","#e040fb"] }
};
let curTheme = "gruvbox";

const STATE_TITLE = 0;
const STATE_INTRO = 1;
const STATE_PLAY = 2;
const STATE_GAMEOVER = 3;
const STATE_DEAD_TEXT1 = 4;
const STATE_DEAD_TEXT2 = 5;
const STATE_WIN = 6;
const STATE_STATS = 7;
let gameState = STATE_TITLE;

const DIFF_MODES = ["EASY", "NORMAL", "HARD"];
const DIFF_MINES = [15, 48, 70];
let diffIdx = 1;

const COLS = 14, ROWS = 14;
const GRID_W = 480, GRID_H = 480;
const TILE_W = GRID_W / COLS;
const TILE_H = GRID_H / ROWS;
const GRID_Y = 90;

let grid = [], cursor = { x: 7, y: 7 }, flagsCount = 0, firstMove = true;
let introText = "THE WAR WAS LONG OVER.\n\nBUT SOMEONE NEEDED\n\nTO CLEAR THE MINES...";
let introChars = 0, introTicker = 0;
let gameStartTime = 0, gameFinalTime = 0;
let shakeTime = 0;

let stats = JSON.parse(localStorage.getItem("mines_stats_v5")) || {
    EASY: { played: 0, wins: 0, totalTime: 0 },
    NORMAL: { played: 0, wins: 0, totalTime: 0 },
    HARD: { played: 0, wins: 0, totalTime: 0 }
};

function saveStats() {
    localStorage.setItem("mines_stats_v5", JSON.stringify(stats));
}

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, type = "square", vol = 0.1) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function noise(dur, vol = 0.1) {
    if (!audioCtx) return;
    let bufferSize = audioCtx.sampleRate * dur, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    let n = audioCtx.createBufferSource(); n.buffer = buffer;
    let g = audioCtx.createGain(); g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    n.connect(g); g.connect(audioCtx.destination); n.start();
}

function initGrid() {
    grid = []; flagsCount = 0; firstMove = true;
    gameStartTime = Date.now();
    stats[DIFF_MODES[diffIdx]].played++;
    saveStats();
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) grid[r][c] = { mine: false, revealed: false, flagged: false, count: 0 };
    }
}

function placeMines(ex, ey) {
    let placed = 0;
    let totalMines = DIFF_MINES[diffIdx];
    while (placed < totalMines) {
        let r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
        if (!grid[r][c].mine && (Math.abs(r - ey) > 1 || Math.abs(c - ex) > 1)) { grid[r][c].mine = true; placed++; }
    }
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c].mine) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (grid[r+dr] && grid[r+dr][c+dc] && grid[r+dr][c+dc].mine) count++;
                }
            }
            grid[r][c].count = count;
        }
    }
}

function reveal(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    let cell = grid[y][x];
    if (cell.revealed || cell.flagged) return;
    if (firstMove) { firstMove = false; placeMines(x, y); cell = grid[y][x]; }
    
    cell.revealed = true;
    
    if (cell.mine) {
        gameFinalTime = Math.floor((Date.now() - gameStartTime) / 1000);
        shakeTime = 25;
        gameState = STATE_GAMEOVER;
        noise(0.8, 0.4); tone(50, 0.6, "sawtooth", 0.5);
        return;
    }

    tone(180 + Math.random() * 40, 0.04, "triangle", 0.12);

    if (cell.count === 0) {
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) reveal(x + dc, y + dr);
        }
    }
    checkWin();
}

function toggleFlag(x, y) {
    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
    let cell = grid[y][x]; if (cell.revealed) return;
    cell.flagged = !cell.flagged; flagsCount += cell.flagged ? 1 : -1;
    tone(cell.flagged ? 400 : 280, 0.06, "square", 0.08);
}

function checkWin() {
    let won = true;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) { if (!grid[r][c].mine && !grid[r][c].revealed) won = false; }
    }
    if (won) {
        gameFinalTime = Math.floor((Date.now() - gameStartTime) / 1000);
        let m = DIFF_MODES[diffIdx];
        stats[m].wins++;
        stats[m].totalTime += gameFinalTime;
        saveStats();
        gameState = STATE_WIN;
        tone(300, 0.1, "sine"); setTimeout(() => tone(400, 0.1, "sine"), 80); setTimeout(() => tone(500, 0.1, "sine"), 160);
    }
}

function getCoords(e) {
    let rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * (480 / rect.width), y: (e.clientY - rect.top) * (640 / rect.height) };
}

let touchTimer = null, isLongPress = false, touchStartX = 0, touchStartY = 0;
function handleStart(e) {
    initAudio();
    let c = getCoords(e); touchStartX = c.x; touchStartY = c.y; isLongPress = false;
    if (gameState === STATE_PLAY) {
        let cx = Math.floor(c.x / TILE_W), cy = Math.floor((c.y - GRID_Y) / TILE_H);
        if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) {
            cursor.x = cx; cursor.y = cy;
            touchTimer = setTimeout(() => { isLongPress = true; toggleFlag(cx, cy); }, 400);
        }
    }
}

function handleEnd(e) {
    if (touchTimer) clearTimeout(touchTimer);
    if (isLongPress) return;
    let c = getCoords(e);

    if (gameState !== STATE_PLAY) {
        if (gameState === STATE_TITLE) {
            if (c.y >= 130 && c.y <= 175) {
                if (c.x >= 100 && c.x <= 150) { diffIdx = (diffIdx - 1 + 3) % 3; tone(200, 0.05); return; }
                if (c.x >= 330 && c.x <= 380) { diffIdx = (diffIdx + 1) % 3; tone(200, 0.05); return; }
            }
            if (c.y >= 190 && c.y <= 226 && c.x >= 140 && c.x <= 340) {
                gameState = STATE_INTRO; introChars = 0; introTicker = 0; tone(440, 0.1); return;
            }
            if (c.y >= 250 && c.y <= 286 && c.x >= 140 && c.x <= 340) {
                gameState = STATE_STATS; tone(440, 0.1); return;
            }
            if (c.y >= 340 && c.y <= 600) {
                let keys = Object.keys(THEMES);
                let idx = Math.floor((c.y - 340) / 25);
                if (keys[idx]) { curTheme = keys[idx]; tone(320, 0.05, "sine"); return; }
            }
        } else if (gameState === STATE_INTRO) {
            if (introChars < introText.length) { introChars = introText.length; }
            else { initGrid(); gameState = STATE_PLAY; tone(440, 0.1); }
        } else if (gameState === STATE_GAMEOVER) {
            gameState = STATE_DEAD_TEXT1; tone(220, 0.1);
        } else if (gameState === STATE_DEAD_TEXT1) {
            gameState = STATE_DEAD_TEXT2; tone(220, 0.1);
        } else if (gameState === STATE_DEAD_TEXT2 || gameState === STATE_WIN || gameState === STATE_STATS) {
            gameState = STATE_TITLE; tone(220, 0.1);
        }
        return;
    }

    if (Math.hypot(c.x - touchStartX, c.y - touchStartY) > 15) return;

    if (gameState === STATE_PLAY) {
        let cx = Math.floor(c.x / TILE_W), cy = Math.floor((c.y - GRID_Y) / TILE_H);
        if (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS) reveal(cx, cy);
    }
}

window.addEventListener("pointerdown", handleStart); window.addEventListener("pointerup", handleEnd);
window.addEventListener("keydown", (e) => {
    initAudio();
    let k = e.key.toLowerCase();
    if (gameState === STATE_TITLE) {
        if (e.key === "ArrowLeft") { diffIdx = (diffIdx - 1 + 3) % 3; tone(200, 0.05); }
        if (e.key === "ArrowRight") { diffIdx = (diffIdx + 1) % 3; tone(200, 0.05); }
        if (e.key === "Enter" || k === "z") { gameState = STATE_INTRO; introChars = 0; introTicker = 0; tone(440, 0.1); }
    } else if (gameState === STATE_INTRO) {
        if (introChars < introText.length) introChars = introText.length;
        else { initGrid(); gameState = STATE_PLAY; tone(440, 0.1); }
    } else if (gameState === STATE_GAMEOVER) {
        gameState = STATE_DEAD_TEXT1; tone(220, 0.1);
    } else if (gameState === STATE_DEAD_TEXT1) {
        gameState = STATE_DEAD_TEXT2; tone(220, 0.1);
    } else if (gameState === STATE_DEAD_TEXT2 || gameState === STATE_WIN || gameState === STATE_STATS) {
        if (k === "z" || e.key === "Enter") { gameState = STATE_TITLE; tone(220, 0.1); }
    } else if (gameState === STATE_PLAY) {
        if (e.key === "ArrowUp" && cursor.y > 0) cursor.y--; if (e.key === "ArrowDown" && cursor.y < ROWS - 1) cursor.y++;
        if (e.key === "ArrowLeft" && cursor.x > 0) cursor.x--; if (e.key === "ArrowRight" && cursor.x < COLS - 1) cursor.x++;
        if (k === "z") reveal(cursor.x, cursor.y); if (k === "x") toggleFlag(cursor.x, cursor.y);
    }
});

function draw() {
    let T = THEMES[curTheme];
    ctx.save();
    
    if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * 12;
        let dy = (Math.random() - 0.5) * 12;
        ctx.translate(dx, dy);
        shakeTime--;
    }

    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, 480, 640);
    ctx.textAlign = "center";

    if (gameState === STATE_TITLE) {
        ctx.fillStyle = T.act; ctx.font = "22px 'Press Start 2P'"; ctx.fillText("SWEEPER OF MINES", 240, 60);
        ctx.fillStyle = T.text; ctx.font = "11px 'Press Start 2P'"; ctx.fillText("DIFFICULTY:", 240, 115);
        ctx.fillText("<", 115, 147); ctx.fillText(">", 355, 147);
        ctx.fillText(DIFF_MODES[diffIdx], 240, 147);

        ctx.fillStyle = T.hide; ctx.fillRect(140, 190, 200, 36);
        ctx.fillStyle = T.text; ctx.fillText("START GAME", 240, 212);

        ctx.fillStyle = T.hide; ctx.fillRect(140, 250, 200, 36);
        ctx.fillStyle = T.text; ctx.fillText("STATISTICS", 240, 272);

        ctx.font = "10px 'Press Start 2P'"; ctx.fillStyle = T.text; ctx.fillText("THEMES:", 240, 320);
        Object.keys(THEMES).forEach((k, i) => {
            ctx.fillStyle = curTheme === k ? T.act : T.hide;
            ctx.fillText((curTheme === k ? "> " : "") + k.toUpperCase(), 240, 350 + i * 25);
        });
    } else if (gameState === STATE_INTRO) {
        ctx.fillStyle = T.text; ctx.font = "12px 'Press Start 2P'";
        introTicker++; if (introTicker % 2 === 0 && introChars < introText.length) { introChars++; if(introChars%3===0) tone(600,0.01,"sine",0.02); }
        let lines = introText.substring(0, introChars).split("\n");
        lines.forEach((l, i) => ctx.fillText(l, 240, 220 + i * 28));
        if (introChars === introText.length) {
            ctx.fillStyle = T.act; ctx.font = "10px 'Press Start 2P'"; ctx.fillText("TAP OR PRESS Z TO CONTINUE", 240, 480);
        }
    } else if (gameState === STATE_GAMEOVER) {
        ctx.fillStyle = T.mine; ctx.font = "28px 'Press Start 2P'"; ctx.fillText("GAME OVER", 240, 280);
        ctx.fillStyle = T.text; ctx.font = "10px 'Press Start 2P'"; ctx.fillText("TAP SCREEN TO CONTINUE", 240, 360);
    } else if (gameState === STATE_DEAD_TEXT1) {
        ctx.fillStyle = T.text; ctx.font = "12px 'Press Start 2P'";
        ctx.fillText("YOU DIED TRYING TO MAKE", 240, 260);
        ctx.fillText("COUNTLESS LIVES SAFER.", 240, 300);
        ctx.fillStyle = T.act; ctx.font = "10px 'Press Start 2P'"; ctx.fillText("TAP SCREEN TO CONTINUE", 240, 420);
    } else if (gameState === STATE_DEAD_TEXT2) {
        ctx.fillStyle = T.text; ctx.font = "12px 'Press Start 2P'";
        ctx.fillText("EVERY YEAR, OVER 5,000", 240, 220);
        ctx.fillText("PEOPLE ARE KILLED OR", 240, 260);
        ctx.fillText("MAIMED BY DECADE-OLD", 240, 300);
        ctx.fillText("LANDMINES LEFT BEHIND.", 240, 340);
        ctx.fillStyle = T.act; ctx.font = "10px 'Press Start 2P'"; ctx.fillText("TAP SCREEN TO RETURN", 240, 460);
    } else if (gameState === STATE_WIN) {
        ctx.fillStyle = T.act; ctx.font = "32px 'Press Start 2P'"; ctx.fillText("VICTORY!", 240, 200);
        ctx.fillStyle = T.text; ctx.font = "14px 'Press Start 2P'";
        ctx.fillText(`TIME: ${gameFinalTime}s`, 240, 280);
        ctx.font = "10px 'Press Start 2P'";
        ctx.fillText("THE SECTOR IS RENDERED SECURE.", 240, 340);
        ctx.fillStyle = T.act; ctx.fillText("TAP SCREEN TO CONTINUE", 240, 440);
    } else if (gameState === STATE_STATS) {
        ctx.fillStyle = T.act; ctx.font = "20px 'Press Start 2P'"; ctx.fillText("STATISTICS", 240, 80);
        ctx.fillStyle = T.text; ctx.font = "10px 'Press Start 2P'";
        let yy = 150;
        DIFF_MODES.forEach(m => {
            ctx.fillStyle = T.act; ctx.fillText(`--- ${m} ---`, 240, yy);
            ctx.fillStyle = T.text;
            ctx.fillText(`PLAYED: ${stats[m].played}`, 240, yy + 20);
            ctx.fillText(`WINS: ${stats[m].wins}`, 240, yy + 40);
            let avg = stats[m].wins > 0 ? Math.floor(stats[m].totalTime / stats[m].wins) : 0;
            ctx.fillText(`AVG TIME: ${avg}s`, 240, yy + 60);
            yy += 100;
        });
        ctx.fillStyle = T.act; ctx.fillText("TAP TO RETURN", 240, 560);
    } else {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cell = grid[r][c];
                let x = c * TILE_W;
                let y = GRID_Y + r * TILE_H;
                
                if (!cell.revealed) {
                    ctx.fillStyle = T.hide; ctx.fillRect(x, y, TILE_W - 1, TILE_H - 1);
                    if (cell.flagged) { ctx.fillStyle = T.mine; ctx.fillRect(x + 11, y + 11, 12, 12); }
                } else {
                    ctx.fillStyle = T.rev; ctx.fillRect(x, y, TILE_W - 1, TILE_H - 1);
                    if (cell.mine) { ctx.fillStyle = T.mine; ctx.fillRect(x + 10, y + 10, 14, 14); }
                    else if (cell.count > 0) {
                        ctx.font = "14px 'Press Start 2P'"; ctx.textBaseline = "middle";
                        ctx.fillStyle = T.num[cell.count - 1] || T.text;
                        ctx.fillText(cell.count, x + TILE_W/2, y + TILE_H/2 + 1);
                    }
                }
                if (gameState === STATE_PLAY && cursor.x === c && cursor.y === r) {
                    ctx.strokeStyle = T.act; ctx.lineWidth = 2; ctx.strokeRect(x, y, TILE_W - 1, TILE_H - 1);
                }
            }
        }
        ctx.textBaseline = "middle";
        ctx.fillStyle = T.hide; ctx.fillRect(120, 585, 240, 36);
        ctx.fillStyle = T.text; ctx.font = "10px 'Press Start 2P'";
        let totalMines = DIFF_MINES[diffIdx];
        ctx.fillText(`MINES: ${flagsCount}/${totalMines}`, 240, 603);
    }
    
    ctx.restore();
    requestAnimationFrame(draw);
}
initGrid(); gameState = STATE_TITLE; draw();
</script>
</body>
</html>
