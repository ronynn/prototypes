<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rekishi Teki (Histori-Cal)</title>
    <style>
      :root { --bg:#282828; --surface:#3c3836; --border:#d79921; --text:#ebdbb2; --accent:#fabd2f; --accent-txt:#282828; --gray:#928374; --zoom:1; --radius:calc(8px * var(--zoom)); --radius-sm:calc(5px * var(--zoom)); --font:ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
      [data-theme="dracula"] { --bg:#282a36; --surface:#44475a; --border:#ff79c6; --text:#f8f8f2; --accent:#bd93f9; --accent-txt:#282a36; --gray:#6272a4; }
      [data-theme="monokai"] { --bg:#272822; --surface:#3e3d32; --border:#f92672; --text:#f8f8f2; --accent:#a6e22e; --accent-txt:#272822; --gray:#75715e; }
      [data-theme="nord"] { --bg:#2e3440; --surface:#3b4252; --border:#88c0d0; --text:#d8dee9; --accent:#81a1c1; --accent-txt:#2e3440; --gray:#4c566a; }
      [data-theme="purple"] { --bg:#ffffff; --surface:#f5f5f5; --border:#8e24aa; --text:#333333; --accent:#8e24aa; --accent-txt:#ffffff; --gray:#888888; }
      [data-theme="amoled"] { --bg:#000000; --surface:#121212; --border:#ffffff; --text:#ffffff; --accent:#ffffff; --accent-txt:#000000; --gray:#555555; }
      [data-theme="cupcake"] { --bg:#faf7f5; --surface:#efeae6; --border:#ffb6c1; --text:#2e282a; --accent:#ffb6c1; --accent-txt:#2e282a; --gray:#b0a8a6; }
      [data-theme="catppuccin"] { --bg:#1e1e2e; --surface:#313244; --border:#cba6f7; --text:#cdd6f4; --accent:#cba6f7; --accent-txt:#11111b; --gray:#6c7086; }
      [data-theme="catppuccin-frappe"] { --bg:#303446; --surface:#414559; --border:#ca9ee6; --text:#c6d0f5; --accent:#ca9ee6; --accent-txt:#232634; --gray:#737994; }
      [data-theme="everforest"] { --bg:#2d353b; --surface:#3d484d; --border:#a7c080; --text:#d3c6aa; --accent:#a7c080; --accent-txt:#232a2e; --gray:#859289; }
      [data-theme="everforest-light"] { --bg:#fdf6e3; --surface:#eee8d5; --border:#859900; --text:#586e75; --accent:#859900; --accent-txt:#fdf6e3; --gray:#93a1a1; }
      [data-theme="tokyo-night"] { --bg:#1a1b26; --surface:#24283c; --border:#7aa2f7; --text:#a9b1d6; --accent:#7aa2f7; --accent-txt:#1d202f; --gray:#565f89; }

      * { box-sizing:border-box; margin:0; padding:0; user-select:none; -webkit-tap-highlight-color:transparent; font-family:var(--font); }
      input, textarea { user-select:text; }
      html, body { height:100%; }
      body { background:var(--bg); color:var(--text); overflow:hidden; height:100vh; height:100dvh; display:flex; flex-direction:column; font-size:calc(14px * var(--zoom)); }

      header { flex:0 0 auto; display:flex; gap:calc(22px * var(--zoom)); padding:calc(18px * var(--zoom)) calc(20px * var(--zoom)) calc(12px * var(--zoom)); font-size:calc(19px * var(--zoom)); background:var(--bg); z-index:10; }
      header div { opacity:.35; transition:opacity .2s; padding-bottom:calc(6px * var(--zoom)); cursor:pointer; letter-spacing:calc(.4px * var(--zoom)); }
      header div.active { opacity:1; color:var(--accent); border-bottom:calc(2px * var(--zoom)) solid var(--accent); margin-bottom:calc(-2px * var(--zoom)); }

      #viewport { display:flex; flex:1 1 auto; min-height:0; width:200vw; transition:transform .25s cubic-bezier(.1,.9,.2,1); will-change:transform; }
      .screen { flex:0 0 100vw; width:100vw; height:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:calc(18px * var(--zoom)); }

      .card { background:var(--surface); padding:calc(18px * var(--zoom)); margin-bottom:calc(14px * var(--zoom)); border-radius:var(--radius); }
      .card-title { font-size:calc(10px * var(--zoom)); color:var(--gray); text-transform:uppercase; letter-spacing:calc(1.6px * var(--zoom)); margin-bottom:calc(14px * var(--zoom)); }

      button { width:100%; padding:calc(11px * var(--zoom)); background:var(--accent); color:var(--accent-txt); border:5px; border-radius:var(--radius-sm); font-size:calc(13px * var(--zoom)); cursor:pointer; text-transform:uppercase; letter-spacing:calc(.6px * var(--zoom)); transition:filter .12s,background .12s,color .12s; }
      button:active { filter:brightness(.82); }
      .btn-soft { background:transparent; color:var(--text); border:calc(1px * var(--zoom)) solid var(--border); }

      .seg-ctrl { display:grid; grid-template-columns:repeat(3,1fr); gap:calc(6px * var(--zoom)); }
      .seg-ctrl.four { grid-template-columns:repeat(4,1fr); }
      .seg-ctrl + .seg-ctrl { margin-top:calc(8px * var(--zoom)); }
      .seg-btn { padding:calc(11px * var(--zoom)) calc(4px * var(--zoom)); background:transparent; color:var(--gray); border:calc(1px * var(--zoom)) solid var(--border); border-radius:var(--radius-sm); font-size:calc(12px * var(--zoom)); text-align:center; text-transform:uppercase; letter-spacing:calc(.6px * var(--zoom)); }
      .seg-btn.active { background:var(--accent); color:var(--accent-txt); border-color:var(--accent); }

      .theme-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:calc(6px * var(--zoom)); }
      .theme-chip { padding:calc(9px * var(--zoom)) calc(4px * var(--zoom)); background:transparent; color:var(--gray); border:calc(1px * var(--zoom)) solid var(--border); border-radius:var(--radius-sm); font-size:calc(10px * var(--zoom)); text-align:center; text-transform:uppercase; letter-spacing:calc(.4px * var(--zoom)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .theme-chip.active { background:var(--accent); color:var(--accent-txt); border-color:var(--accent); }

      .cal-head { display:flex; align-items:center; justify-content:center; gap:calc(16px * var(--zoom)); margin-bottom:calc(16px * var(--zoom)); }
      .cal-arrow { width:calc(42px * var(--zoom)); height:calc(42px * var(--zoom)); padding:0; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--text); border:none; border-radius:50%; font-size:calc(20px * var(--zoom)); font-weight:600; line-height:1; cursor:pointer; transition:background .15s,color .15s,transform .1s; }
      .cal-arrow:active { background:var(--accent); color:var(--accent-txt); transform:scale(.94); }
      .month-wrap { position:relative; display:inline-block; }
      .month-lbl { font-size:calc(19px * var(--zoom)); background:none; border:none; color:var(--accent); cursor:pointer; padding:calc(4px * var(--zoom)) calc(12px * var(--zoom)); text-transform:none; letter-spacing:0; border-radius:var(--radius-sm); }
      .month-pick { position:absolute; inset:0; opacity:0; cursor:pointer; border:none; background:none; width:100%; }

      .week-head { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:calc(10px * var(--zoom)); color:var(--gray); letter-spacing:calc(1px * var(--zoom)); margin-bottom:calc(8px * var(--zoom)); }
      .week-head .sun-h { color:#ff5252; }
      .week-head .sat-h { color:#00b0ff; }

      .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:calc(3px * var(--zoom)); }
      .cal-cell { padding:calc(6px * var(--zoom)); background:var(--surface); display:flex; flex-direction:column; justify-content:space-between; min-height:calc(64px * var(--zoom)); cursor:pointer; border-radius:var(--radius-sm); transition:background .12s; }
      .cal-cell:active { filter:brightness(1.25); }
      .cal-cell.empty { visibility:hidden; pointer-events:none; }
      .cal-cell.today { box-shadow:inset 0 0 0 calc(2px * var(--zoom)) var(--accent); }
      .cell-num { font-size:calc(13px * var(--zoom)); color:var(--text); }
      .cal-cell.sun .cell-num { color:#ff5252; }
      .cal-cell.sat .cell-num { color:#00b0ff; }
      .cell-dots { display:flex; gap:calc(3px * var(--zoom)); flex-wrap:wrap; margin-top:auto; padding-top:calc(4px * var(--zoom)); }
      .cell-dot { width:calc(5px * var(--zoom)); height:calc(5px * var(--zoom)); border-radius:50%; }

      #gk-modal { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:300; display:none; align-items:center; justify-content:center; padding:calc(18px * var(--zoom)); }
      #gk-modal.open { display:flex; }
      .gk-body { background:var(--bg); width:100%; max-width:calc(480px * var(--zoom)); max-height:80vh; overflow-y:auto; padding:calc(22px * var(--zoom)); display:flex; flex-direction:column; gap:calc(12px * var(--zoom)); -webkit-overflow-scrolling:touch; border-radius:var(--radius); }
      .gk-date { font-size:calc(15px * var(--zoom)); color:var(--accent); letter-spacing:calc(1px * var(--zoom)); padding-bottom:calc(10px * var(--zoom)); border-bottom:calc(1px * var(--zoom)) solid var(--surface); }
      .gk-item { padding:calc(10px * var(--zoom)); background:var(--surface); border-left:calc(3px * var(--zoom)) solid var(--border); border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
      .gk-item + .gk-item { margin-top:calc(8px * var(--zoom)); }
      .gk-title { font-size:calc(14px * var(--zoom)); margin-bottom:calc(3px * var(--zoom)); }
      .gk-extra { font-size:calc(12px * var(--zoom)); color:var(--gray); }
      .gk-empty { font-size:calc(13px * var(--zoom)); color:var(--gray); }
      .gk-hist-title { font-size:calc(11px * var(--zoom)); color:var(--accent); letter-spacing:calc(1.2px * var(--zoom)); margin-top:calc(14px * var(--zoom)); margin-bottom:calc(10px * var(--zoom)); padding-top:calc(14px * var(--zoom)); border-top:calc(1px * var(--zoom)) dashed var(--gray); text-transform:uppercase; }

      .file-list { margin-top:calc(12px * var(--zoom)); background:var(--bg); padding:calc(10px * var(--zoom)); max-height:calc(180px * var(--zoom)); overflow-y:auto; border-radius:var(--radius-sm); }
      .file-row { font-size:calc(12px * var(--zoom)); color:var(--text); padding:calc(5px * var(--zoom)) 0; border-bottom:calc(1px * var(--zoom)) solid var(--surface); }
      .file-row:last-child { border-bottom:none; }

      .about { font-size:calc(13px * var(--zoom)); line-height:1.65; opacity:.85; }
    </style>
  </head>
  <body>
    <header>
      <div id="tab-home" class="active" onclick="switchScreen(0)">Home</div>
      <div id="tab-settings" onclick="switchScreen(1)">Settings</div>
    </header>

    <div id="viewport">
      <div class="screen" id="home-screen">
        <div class="cal-head">
          <button class="cal-arrow" onclick="changeMonth(-1)" aria-label="Previous month">←</button>
          <div class="month-wrap">
            <button class="month-lbl" id="month-label-btn">—</button>
            <input type="month" id="calendar-month-picker" class="month-pick" aria-label="Pick month" />
          </div>
          <button class="cal-arrow" onclick="changeMonth(1)" aria-label="Next month">→</button>
        </div>
        <div class="week-head">
          <div class="sun-h">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div class="sat-h">SAT</div>
        </div>
        <div class="cal-grid" id="calendar-matrix"></div>
      </div>

      <div class="screen" id="settings-screen">
        <div class="card">
          <div class="card-title">Display</div>
          <div class="seg-ctrl" id="font-btns">
            <button class="seg-btn" data-font="mono" onclick="setFont('mono')">Mono</button>
            <button class="seg-btn" data-font="serif" onclick="setFont('serif')">Serif</button>
            <button class="seg-btn" data-font="sans" onclick="setFont('sans')">Sans</button>
          </div>
          <div class="seg-ctrl four" id="size-btns">
            <button class="seg-btn" data-size="s" onclick="setUiSize('s')">S</button>
            <button class="seg-btn" data-size="m" onclick="setUiSize('m')">M</button>
            <button class="seg-btn" data-size="l" onclick="setUiSize('l')">L</button>
            <button class="seg-btn" data-size="xl" onclick="setUiSize('xl')">XL</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Theme</div>
          <div class="theme-grid" id="theme-btns">
            <button class="theme-chip" data-th="gruvbox" onclick="setTheme('gruvbox')">Gruvbox</button>
            <button class="theme-chip" data-th="dracula" onclick="setTheme('dracula')">Dracula</button>
            <button class="theme-chip" data-th="monokai" onclick="setTheme('monokai')">Monokai</button>
            <button class="theme-chip" data-th="nord" onclick="setTheme('nord')">Nord</button>
            <button class="theme-chip" data-th="purple" onclick="setTheme('purple')">Purple</button>
            <button class="theme-chip" data-th="amoled" onclick="setTheme('amoled')">Amoled</button>
            <button class="theme-chip" data-th="cupcake" onclick="setTheme('cupcake')">Cupcake</button>
            <button class="theme-chip" data-th="catppuccin" onclick="setTheme('catppuccin')">Catppuccin</button>
            <button class="theme-chip" data-th="catppuccin-frappe" onclick="setTheme('catppuccin-frappe')">Frappe</button>
            <button class="theme-chip" data-th="everforest" onclick="setTheme('everforest')">Everforest</button>
            <button class="theme-chip" data-th="everforest-light" onclick="setTheme('everforest-light')">Ev-Light</button>
            <button class="theme-chip" data-th="tokyo-night" onclick="setTheme('tokyo-night')">Tokyo</button>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Data</div>
          <input type="file" id="csv-directory-loader" webkitdirectory directory multiple style="display:none" onchange="importFolderCSV(event)" />
          <button class="btn-soft" onclick="document.getElementById('csv-directory-loader').click()">Select Folder</button>
          <div class="file-list" id="csv-menu-box" style="display:none">
            <div id="csv-serial-list"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">About</div>
          <div class="about" id="project-description-box"></div>
        </div>
      </div>
    </div>

    <div id="gk-modal">
      <div class="gk-body">
        <div class="gk-date" id="gk-target-date"></div>
        <div id="gk-current-events"></div>
        <div id="gk-history-section">
          <div class="gk-hist-title">On this day in history</div>
          <div id="gk-history-events"></div>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const UI_SIZES = { s:0.8, m:1, l:1.25, xl:1.5 };
      const FONTS = {
        mono: "ui-monospace,'SF Mono',Menlo,Consolas,monospace",
        serif: "Georgia,'Times New Roman','Noto Serif',serif",
        sans: "system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
      };
      const DEFAULT_EVENTS = [
        { date:"2026-06-08", color:"#2196f3", event:"World Oceans Day", extra:"Theme: Protect Ocean" },
        { date:"1776-07-04", color:"#ff5252", event:"USA Independence", extra:"Historic Day Declaration" },
        { date:"1947-08-15", color:"#ff9933", event:"India Independence", extra:"Historic Shift 1947" },
        { date:"2026-06-13", color:"#4caf50", event:"Project Release", extra:"" }
      ];

      let state = { theme:"gruvbox", uiSize:"m", fontFamily:"mono", eventsDatabase:[], fileRegistry:[] };
      let currentYear = 0;
      let currentMonth = 0;
      let eventIndex = { byDate:new Map(), byMD:new Map() };
      const el = {};

      const $ = (id) => document.getElementById(id);
      const pad2 = (n) => String(n).padStart(2, "0");
      const isoOf = (y, m, d) => y + "-" + pad2(m) + "-" + pad2(d);
      const ESC = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" };
      const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ESC[c]);

      function cacheElements() {
        el.viewport = $("viewport");
        el.tabHome = $("tab-home");
        el.tabSettings = $("tab-settings");
        el.monthLabel = $("month-label-btn");
        el.monthPicker = $("calendar-month-picker");
        el.matrix = $("calendar-matrix");
        el.themeBtns = $("theme-btns");
        el.sizeBtns = $("size-btns");
        el.fontBtns = $("font-btns");
        el.fileMenuBox = $("csv-menu-box");
        el.fileList = $("csv-serial-list");
        el.gkModal = $("gk-modal");
        el.gkDate = $("gk-target-date");
        el.gkCurrent = $("gk-current-events");
        el.gkHistSection = $("gk-history-section");
        el.gkHistory = $("gk-history-events");
      }

      function init() {
        cacheElements();
        const saved = localStorage.getItem("app_state");
        if (saved) { try { Object.assign(state, JSON.parse(saved)); } catch (e) {} }
        migrateState();

        const now = new Date();
        currentYear = now.getFullYear();
        currentMonth = now.getMonth();

        setTheme(state.theme);
        setFont(state.fontFamily);
        setUiSize(state.uiSize);
        writeAboutText();

        if (!Array.isArray(state.eventsDatabase) || state.eventsDatabase.length === 0) state.eventsDatabase = DEFAULT_EVENTS.slice();

        buildEventIndex();
        bindEvents();
        renderCalendar();
        updateFileMenuDisplay();
      }

      function migrateState() {
        if (!state.uiSize) state.uiSize = { 1:"s", 2:"m", 3:"l" }[state.scaleLevel] || "m";
        delete state.scaleLevel;
        if (!UI_SIZES[state.uiSize]) state.uiSize = "m";
        if (!FONTS[state.fontFamily]) state.fontFamily = "mono";
        if (!state.theme) state.theme = "gruvbox";
      }

      function saveState() {
        try { localStorage.setItem("app_state", JSON.stringify(state)); } catch (e) {}
      }

      function writeAboutText() {
        $("project-description-box").innerHTML =
          "App: Rekishi Teki (Histori-Cal)<br><br>" +
          "Goals of this project is to help remember historical events and keep track of events of importance through csv based note tracking. " +
          "It can be also used to track personal journal entries and upcoming events accurately inside mobile webview frameworks.";
      }

      function buildEventIndex() {
        const byDate = new Map();
        const byMD = new Map();
        for (const ev of state.eventsDatabase) {
          if (!ev || !ev.date) continue;
          let b = byDate.get(ev.date);
          if (!b) byDate.set(ev.date, (b = []));
          b.push(ev);
          const md = ev.date.slice(-5);
          let m = byMD.get(md);
          if (!m) byMD.set(md, (m = []));
          m.push(ev);
        }
        eventIndex = { byDate, byMD };
      }

      function switchScreen(idx) {
        el.viewport.style.transform = "translateX(-" + (idx * 100) + "vw)";
        el.tabHome.classList.toggle("active", idx === 0);
        el.tabSettings.classList.toggle("active", idx === 1);
      }

      function bindEvents() {
        el.matrix.addEventListener("click", (e) => {
          const cell = e.target.closest(".cal-cell");
          if (!cell || !cell.dataset.iso) return;
          launchGkViewer(cell.dataset.iso, cell.dataset.md);
        });

        el.monthPicker.addEventListener("change", (e) => {
          if (!e.target.value) return;
          const parts = e.target.value.split("-");
          currentYear = parseInt(parts[0], 10);
          currentMonth = parseInt(parts[1], 10) - 1;
          renderCalendar();
        });

        el.gkModal.addEventListener("click", (e) => {
          if (e.target === el.gkModal) el.gkModal.classList.remove("open");
        });

        let sx = 0, sy = 0, active = false;
        window.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) { active = false; return; }
          if (e.target.closest("input, button, #gk-modal")) { active = false; return; }
          sx = e.touches[0].clientX;
          sy = e.touches[0].clientY;
          active = true;
        }, { passive: true });
        window.addEventListener("touchmove", (e) => {
          if (!active) return;
          const dx = e.touches[0].clientX - sx;
          const dy = e.touches[0].clientY - sy;
          const adx = Math.abs(dx), ady = Math.abs(dy);
          if (adx > ady && adx > 40) { switchScreen(dx > 0 ? 0 : 1); active = false; }
          else if (ady > adx && ady > 50) { if (el.tabHome.classList.contains("active")) changeMonth(dy > 0 ? -1 : 1); active = false; }
        }, { passive: true });
      }

      function setTheme(t) {
        state.theme = t;
        document.body.setAttribute("data-theme", t);
        for (const b of el.themeBtns.querySelectorAll(".theme-chip")) b.classList.toggle("active", b.dataset.th === t);
        saveState();
      }

      function setFont(f) {
        if (!FONTS[f]) f = "mono";
        state.fontFamily = f;
        document.documentElement.style.setProperty("--font", FONTS[f]);
        for (const b of el.fontBtns.querySelectorAll(".seg-btn")) b.classList.toggle("active", b.dataset.font === f);
        saveState();
      }

      function setUiSize(size) {
        if (!UI_SIZES[size]) size = "m";
        state.uiSize = size;
        document.documentElement.style.setProperty("--zoom", UI_SIZES[size]);
        for (const b of el.sizeBtns.querySelectorAll(".seg-btn")) b.classList.toggle("active", b.dataset.size === size);
        saveState();
      }

      function renderCalendar() {
        const firstDow = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
        el.monthLabel.textContent = MONTHS[currentMonth] + " " + currentYear;
        el.monthPicker.value = currentYear + "-" + pad2(currentMonth + 1);

        const now = new Date();
        const todayISO = isoOf(now.getFullYear(), now.getMonth() + 1, now.getDate());
        const ym = currentYear + "-" + pad2(currentMonth + 1) + "-";
        const out = [];

        for (let i = 0; i < firstDow; i++) out.push('<div class="cal-cell empty"></div>');

        for (let d = 1; d <= totalDays; d++) {
          const iso = ym + pad2(d);
          const dow = (firstDow + d - 1) % 7;
          let cls = "cal-cell";
          if (dow === 0) cls += " sun";
          else if (dow === 6) cls += " sat";
          if (iso === todayISO) cls += " today";

          const matches = eventIndex.byDate.get(iso);
          let dots = "";
          if (matches) for (let i = 0; i < matches.length; i++) dots += '<div class="cell-dot" style="background:' + esc(matches[i].color || "var(--gray)") + '"></div>';

          out.push(
            '<div class="' + cls + '" data-iso="' + iso + '" data-md="' + iso.slice(5) + '">' +
              '<div class="cell-num">' + d + '</div>' +
              '<div class="cell-dots">' + dots + '</div>' +
            '</div>'
          );
        }
        el.matrix.innerHTML = out.join("");
      }

      function changeMonth(delta) {
        let m = currentMonth + delta, y = currentYear;
        if (m > 11) { m = 0; y++; }
        else if (m < 0) { m = 11; y--; }
        currentMonth = m;
        currentYear = y;
        renderCalendar();
      }

      function gkItem(ev, borderColor, titleHTML) {
        return '<div class="gk-item" style="border-color:' + borderColor + '">' +
          '<div class="gk-title">' + titleHTML + '</div>' +
          '<div class="gk-extra">' + esc(ev.extra || "") + '</div>' +
        '</div>';
      }

      function launchGkViewer(isoDate, mdString) {
        el.gkDate.textContent = isoDate;

        const direct = eventIndex.byDate.get(isoDate) || [];
        if (direct.length === 0) {
          el.gkCurrent.innerHTML = '<div class="gk-empty">No direct events recorded.</div>';
        } else {
          el.gkCurrent.innerHTML = direct.map((ev) => {
            const c = esc(ev.color || "var(--gray)");
            return gkItem(ev, c, '<span style="color:' + c + '">' + esc(ev.event) + '</span>');
          }).join("");
        }

        const past = (eventIndex.byMD.get(mdString) || [])
          .filter((ev) => ev.date !== isoDate)
          .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

        if (past.length === 0) {
          el.gkHistSection.style.display = "none";
          el.gkHistory.innerHTML = "";
        } else {
          el.gkHistSection.style.display = "block";
          el.gkHistory.innerHTML = past.map((ev) => {
            const year = ev.date.slice(0, 4);
            return gkItem(ev, "var(--accent)",
              '<span style="color:var(--accent)">Year ' + esc(year) + ':</span> ' + esc(ev.event));
          }).join("");
        }

        el.gkModal.classList.add("open");
      }

      function parseCSVLine(line) {
        const out = [];
        let cur = "", inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') { cur += '"'; i++; }
              else inQuotes = false;
            } else cur += ch;
          } else if (ch === '"') inQuotes = true;
          else if (ch === ",") { out.push(cur); cur = ""; }
          else cur += ch;
        }
        out.push(cur);
        return out;
      }

      const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

      function parseCSVData(text) {
        const lines = text.split(/\r?\n/);
        if (!lines.length) return;
        const firstField = (parseCSVLine(lines[0])[0] || "").trim();
        const start = ISO_DATE_RE.test(firstField) ? 0 : 1;

        for (let i = start; i < lines.length; i++) {
          const line = lines[i];
          if (!line || !line.trim()) continue;
          const seg = parseCSVLine(line);
          const dateVal = (seg[0] || "").trim();
          if (!dateVal) continue;
          state.eventsDatabase.push({
            date: dateVal,
            color: (seg[1] || "").trim(),
            event: (seg[2] || "").trim(),
            extra: (seg[3] || "").trim()
          });
        }
      }

      function importFolderCSV(event) {
        const files = Array.from(event.target.files).filter((f) => /\.csv$/i.test(f.name));
        if (!files.length) return;

        state.eventsDatabase = [];
        state.fileRegistry = files.map((f) => f.name);

        let done = 0;
        const finish = () => {
          if (++done !== files.length) return;
          buildEventIndex();
          saveState();
          updateFileMenuDisplay();
          renderCalendar();
          switchScreen(0);
        };

        files.forEach((file) => {
          const reader = new FileReader();
          reader.onload = (e) => { parseCSVData(e.target.result); finish(); };
          reader.onerror = finish;
          reader.readAsText(file);
        });
      }

      function updateFileMenuDisplay() {
        const files = state.fileRegistry || [];
        if (files.length === 0) {
          el.fileMenuBox.style.display = "none";
          el.fileList.innerHTML = "";
          return;
        }
        el.fileMenuBox.style.display = "block";
        el.fileList.innerHTML = files
          .map((name, i) => '<div class="file-row">' + (i + 1) + ". " + esc(name) + "</div>")
          .join("");
      }

      init();
    </script>
  </body>
</html>
